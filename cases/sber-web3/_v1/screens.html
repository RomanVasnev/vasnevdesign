<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Цифровые деньги — прототип</title>
<meta name="description" content="Прототип концепта «Цифровые деньги»: хаб и вход в криптовалюту. Концепт, не связан со СберБанком.">
<!-- SB Sans from Sber's own CDN, the way the Plasma design system connects it -->
<link rel="preconnect" href="https://cdn-app.sberdevices.ru" crossorigin>
<link rel="stylesheet" href="https://cdn-app.sberdevices.ru/shared-static/0.0.0/styles/SBSansText.0.2.0.css">
<link rel="stylesheet" href="https://cdn-app.sberdevices.ru/shared-static/0.0.0/styles/SBSansDisplay.0.2.0.css">
<link rel="stylesheet" href="https://cdn-app.sberdevices.ru/shared-static/0.0.0/styles/SBSansTextMono.0.2.0.css">
<style>
/* one phone, 390 × 844 points. 1rem = 10 points of the phone, set from the frame width */
:root{--bg:#000;--card:rgba(255,255,255,.08);--card2:rgba(255,255,255,.12);--line:rgba(255,255,255,.08);--field:#1E1E1E;--btn:#148F2B;--gl:#3DD26C;--t2:rgba(255,255,255,.62);--t3:rgba(255,255,255,.42);--ui:"SB Sans Text","SBSansText","SB Sans Display","SBSansDisplay",-apple-system,BlinkMacSystemFont,"SF Pro Text","Roboto","Helvetica Neue",Arial,sans-serif;--disp:"SB Sans Display","SBSansDisplay",-apple-system,BlinkMacSystemFont,"SF Pro Display","Roboto",Arial,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:10px}
html,body{height:100%;background:#060608;color:#fff;font-family:var(--ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;text-align:inherit}
.stage{height:100svh;display:grid;place-items:center;align-content:center;gap:14px;padding:16px;background:radial-gradient(60% 50% at 50% 40%,#0E2018 0%,#060608 70%)}
.ph{position:relative;height:min(844px,calc(100svh - 64px));aspect-ratio:390/844;border-radius:5.2rem;overflow:hidden;isolation:isolate;background:var(--bg);box-shadow:0 0 0 1px rgba(255,255,255,.1),0 0 0 .9rem #151517,0 0 0 1rem rgba(255,255,255,.08),0 40px 120px rgba(0,0,0,.6);user-select:none;-webkit-user-select:none}
.cap{font-size:12px;color:rgba(255,255,255,.4);text-align:center}
@media (max-width:560px){.stage{padding:0;gap:0}.ph{height:100svh;width:100vw;aspect-ratio:auto;border-radius:0;box-shadow:none}.cap{display:none}}

/* status bar */
.sb{position:absolute;left:0;right:0;top:0;z-index:20;height:5.4rem;display:flex;align-items:center;justify-content:space-between;padding:1.4rem 3.2rem 0 3.6rem;font-family:var(--disp);font-weight:600;font-size:1.7rem;pointer-events:none}
.sb .r{display:flex;gap:.6rem;align-items:center}
.sb svg{height:1.2rem;fill:#fff}
.isl{position:absolute;left:50%;top:1.1rem;z-index:21;width:12.6rem;height:3.7rem;margin-left:-6.3rem;border-radius:2rem;background:#000}
.home-ind{position:absolute;left:50%;bottom:.8rem;z-index:21;width:13.4rem;height:.5rem;margin-left:-6.7rem;border-radius:1rem;background:rgba(255,255,255,.85);pointer-events:none}

/* screens slide like a navigation stack */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);transition:transform .5s var(--ease),opacity .5s var(--ease);will-change:transform}
.scr.next{transform:translateX(100%)}
.scr.prev{transform:translateX(-28%);opacity:.4}
.scr.up{transform:translateY(100%)}
.wall{position:absolute;left:0;right:0;top:0;height:34rem;z-index:0;pointer-events:none}
.top{position:relative;z-index:2;flex:none;height:10rem;padding:5.4rem 1.2rem 0;display:grid;grid-template-columns:4.4rem 1fr 4.4rem;align-items:center}
.top h2{text-align:center;font-family:var(--disp);font-weight:600;font-size:1.7rem;letter-spacing:-.01em}
.ib{display:grid;place-items:center;width:4.4rem;height:4.4rem;border-radius:50%}
.ib .li{width:2.4rem;height:2.4rem}
.body{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 1.6rem 3.4rem;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.foot{position:relative;z-index:2;flex:none;padding:1.2rem 1.6rem 3.4rem;background:linear-gradient(to top,#000 70%,rgba(0,0,0,0))}

/* type */
.h1{font-family:var(--disp);font-weight:600;font-size:2.8rem;line-height:1.12;letter-spacing:normal}
.lead{margin-top:.8rem;font-size:1.5rem;line-height:1.4;color:var(--t2)}
.h3{margin:2.8rem 0 1.2rem;font-family:var(--disp);font-weight:650;font-size:2rem;letter-spacing:-.02em}
.small{font-size:1.3rem;line-height:1.35;color:var(--t2)}
.note{margin-top:2.4rem;font-size:1.2rem;line-height:1.4;color:var(--t3);text-align:center}

/* blocks */
.li{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{border-radius:1.6rem;background:var(--card)}
.tile{flex:none;display:grid;place-items:center;width:4.4rem;height:4.4rem;border-radius:1.2rem}
.tile .li{width:2.2rem;height:2.2rem}
.row{display:flex;align-items:center;gap:1.2rem;padding:1.4rem 1.4rem 1.4rem 1.4rem;width:100%}
.row .tx{flex:1;min-width:0;display:grid;gap:.3rem}
.row .tx b{font-weight:600;font-size:1.6rem;letter-spacing:-.01em}
.row .tx span{font-size:1.3rem;line-height:1.35;color:var(--t2)}
.row .end{flex:none;display:flex;align-items:center;gap:.4rem;font-size:1.4rem;color:var(--t2)}
.row .end .li{width:1.8rem;height:1.8rem;color:var(--t3)}
.row .sum{font-family:var(--disp);font-weight:600;font-size:1.7rem;color:#fff;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;height:2.4rem;padding:0 .9rem;border-radius:1.2rem;font-size:1.2rem;font-weight:600;background:var(--card2);color:#fff}
.chip.g{background:rgba(61,210,108,.18);color:var(--gl)}
.list{display:grid;gap:.8rem}
.btn{display:flex;align-items:center;justify-content:center;gap:.8rem;width:100%;height:5.6rem;border-radius:1.4rem;background:var(--btn);font-weight:600;font-size:1.7rem;transition:transform .15s,opacity .3s,background .3s}
.btn:active{transform:scale(.98)}
.btn.w{background:#fff;color:#0B0B0D}
.btn.s{background:var(--card2)}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn .li{width:2rem;height:2rem}
.press{transition:transform .15s,background .2s}
.press:active{transform:scale(.985);background:var(--card2)}

/* the trust line */
.trust{margin-top:2rem;border-radius:1.6rem;background:linear-gradient(135deg,rgba(54,180,77,.22),rgba(50,184,211,.14));box-shadow:inset 0 0 0 1px rgba(97,245,124,.18)}
.trust .row{align-items:flex-start}
.trust .tile{width:3.6rem;height:3.6rem;border-radius:1rem;background:rgba(61,210,108,.22);color:var(--gl)}
.trust .tile .li{width:2rem;height:2rem}
.trust .tx b{font-size:1.5rem;line-height:1.3}
.trust .lnk{display:flex;align-items:center;gap:.8rem;width:100%;padding:1.2rem 1.4rem;border-top:1px solid rgba(255,255,255,.08);font-size:1.4rem;font-weight:600;color:var(--gl)}
.trust .lnk .li{width:1.8rem;height:1.8rem}
.trust .lnk .li:last-child{margin-left:auto;color:rgba(61,210,108,.6)}

/* the comparison */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:.2rem;padding:.3rem;border-radius:1.2rem;background:var(--field)}
.seg button{height:3.6rem;border-radius:.95rem;font-size:1.3rem;font-weight:600;text-align:center;color:var(--t2);transition:background .3s,color .3s}
.seg button.on{background:#3A3A3E;color:#fff}
.cmp{margin-top:1.2rem;padding:.4rem 1.4rem}
.cmp .hd,.cmp .ln{display:grid;grid-template-columns:1fr 8.6rem 8.6rem;gap:.8rem;align-items:center}
.cmp .hd{padding:1rem 0 .8rem;font-size:1.2rem;color:var(--t3)}
.cmp .hd span:not(:first-child){text-align:center}
.cmp .ln{min-height:5.2rem;padding:.8rem 0;border-top:1px solid var(--line);font-size:1.4rem;line-height:1.3}
.cmp .v{display:grid;justify-items:center;gap:.2rem;text-align:center;font-size:1.1rem;line-height:1.2;color:var(--t2)}
.cmp .v i{display:grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:50%;font-style:normal}
.cmp .v i .li{width:1.4rem;height:1.4rem;stroke-width:2.6}
.cmp .v.y i{background:rgba(61,210,108,.18);color:var(--gl)}
.cmp .v.n i{background:rgba(255,255,255,.08);color:var(--t3)}
.cmp .v.w i{background:rgba(255,176,32,.18);color:#FFB020}
.cmp .col2 .v{animation:flip .45s var(--ease) both}
@keyframes flip{from{opacity:0;transform:translateY(.6rem)}}

/* coins */
.coin{flex:none;display:grid;place-items:center;width:4.4rem;height:4.4rem;border-radius:50%;font-family:var(--disp);font-weight:600;font-size:2rem;color:#fff}
.coin .li{width:2.4rem;height:2.4rem;stroke-width:2.2}
.c-btc{background:#F7931A}.c-eth{background:#627EEA}.c-usdt{background:#26A17B}
.trio{position:relative;height:16rem;margin:1rem 0 1.4rem}
.trio .coin{position:absolute;width:9.6rem;height:9.6rem;font-size:4.6rem;box-shadow:0 1.6rem 4rem rgba(0,0,0,.45),inset 0 -.6rem 1.4rem rgba(0,0,0,.18),inset 0 .4rem 1rem rgba(255,255,255,.25);animation:float 5s ease-in-out infinite}
.trio .coin .li{width:5rem;height:5rem;stroke-width:2.1}
.trio .c-eth{left:6%;top:3.8rem;animation-delay:-1.6s}
.trio .c-btc{left:50%;top:.6rem;margin-left:-4.8rem;z-index:2;width:11rem;height:11rem}
.trio .c-btc .li{width:5.8rem;height:5.8rem}
.trio .c-usdt{right:6%;top:4.4rem;animation-delay:-3.2s}
@keyframes float{50%{transform:translateY(-1rem)}}
.facts .row{align-items:flex-start;padding:1.4rem}
.facts .tile{width:3.6rem;height:3.6rem;border-radius:1rem;background:var(--card2)}
.facts .tile .li{width:1.9rem;height:1.9rem}
.facts .row+.row{border-top:1px solid var(--line)}

/* the test as stories */
.qs{background:#0C0C0E}
.qs .wall{height:100%}
.bars{position:absolute;left:1.6rem;right:1.6rem;top:5.8rem;z-index:3;display:flex;gap:.5rem}
.bars i{flex:1;height:.3rem;border-radius:.2rem;background:rgba(255,255,255,.25);overflow:hidden}
.bars i b{display:block;height:100%;width:0;background:#fff;transition:width .5s var(--ease)}
.bars i.d b{width:100%}
.qtop{position:absolute;left:1.6rem;right:.8rem;top:6.8rem;z-index:3;display:flex;align-items:center;justify-content:space-between;font-size:1.4rem;color:var(--t2)}
.qbody{position:absolute;inset:12rem 1.6rem 3.4rem;z-index:2;display:flex;flex-direction:column}
.qbody>*{animation:rise .55s var(--ease) both}
.qbody>*:nth-child(2){animation-delay:.06s}.qbody>*:nth-child(3){animation-delay:.12s}.qbody>*:nth-child(4){animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(1.6rem)}}
.qvis{flex:1;min-height:0;display:grid;place-items:center}
.qfact{font-family:var(--disp);font-weight:600;font-size:3rem;line-height:1.1;letter-spacing:normal}
.qwhy{margin-top:1rem;font-size:1.5rem;line-height:1.4;color:var(--t2)}
.qq{margin-top:2.4rem;padding:1.6rem;border-radius:1.8rem;background:rgba(255,255,255,.1);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.qq p{font-weight:600;font-size:1.6rem;line-height:1.35}
.ans{margin-top:1.2rem;display:grid;gap:.8rem}
.ans button{display:flex;align-items:center;gap:1rem;min-height:5.2rem;padding:1rem 1.4rem;border-radius:1.3rem;background:rgba(255,255,255,.1);font-size:1.5rem;line-height:1.3;transition:background .3s,box-shadow .3s,opacity .3s}
.ans button i{flex:none;display:grid;place-items:center;width:2.4rem;height:2.4rem;margin-left:auto;border-radius:50%;opacity:0;transition:opacity .3s,transform .4s cubic-bezier(.3,1.6,.5,1);transform:scale(.4)}
.ans button i .li{width:1.4rem;height:1.4rem;stroke-width:2.8}
.ans.done button{pointer-events:none}
.ans button.ok{background:rgba(61,210,108,.2);box-shadow:inset 0 0 0 1.5px var(--gl)}
.ans button.ok i{opacity:1;transform:none;background:var(--gl);color:#05210E}
.ans button.bad{background:rgba(255,255,255,.06);opacity:.55}
.ans button.bad i{opacity:1;transform:none;background:rgba(255,255,255,.2)}
.fb{display:none;margin-top:1.2rem;font-size:1.4rem;line-height:1.4;color:rgba(255,255,255,.85)}
.fb b{color:var(--gl);font-weight:600}
.fb.miss b{color:#FFB020}
.qq.done .fb{display:block;animation:rise .4s var(--ease) both}
.qnext{margin-top:1.2rem;display:none}
.qq.done+.qnext{display:flex;animation:rise .4s var(--ease) .1s both}

/* the picture above each fact */
.pic{position:relative;width:26rem;height:20rem;display:grid;place-items:center}
.pic .big{width:13rem;height:13rem;border-radius:3.6rem;display:grid;place-items:center;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.pic .big .li{width:6.4rem;height:6.4rem;stroke-width:1.6}
.pic .slash{position:absolute;width:15rem;height:.6rem;border-radius:.4rem;background:#fff;rotate:-40deg;box-shadow:0 0 0 .5rem rgba(12,12,14,.25);animation:cut .6s var(--ease) .45s both}
@keyframes cut{from{width:0}}
.pic .tag{position:absolute;right:1rem;top:1.6rem;padding:.6rem 1.1rem;border-radius:1.2rem;background:#fff;color:#0B0B0D;font-family:var(--disp);font-weight:600;font-size:1.7rem;animation:pop .5s cubic-bezier(.3,1.6,.5,1) .9s both}
@keyframes pop{from{opacity:0;transform:scale(.5)}}
.chart{width:100%;height:100%}
.chart .ln{fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s var(--ease) .3s forwards}
.chart .ar{fill:url(#cg);opacity:0;animation:fade .8s ease 1.2s forwards}
.chart .dot{fill:#fff;opacity:0;animation:fade .3s ease 1.6s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}

/* the yearly limit ring */
.ring{position:relative;width:22rem;height:22rem;margin:0 auto}
.ring svg{width:100%;height:100%;rotate:-90deg}
.ring circle{fill:none;stroke-width:1.6;stroke-linecap:round}
.ring .tr{stroke:rgba(255,255,255,.1)}
.ring .fl{stroke:url(#rg);transition:stroke-dasharray 1.2s var(--ease)}
.ring .used{stroke:rgba(255,255,255,.32);transition:stroke-dasharray 1.2s var(--ease)}
.ring .in{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;gap:.4rem}
.ring .in small{font-size:1.3rem;color:var(--t2)}
.ring .in b{font-family:var(--disp);font-weight:600;font-size:3.4rem;letter-spacing:normal;font-variant-numeric:tabular-nums}
.ring .in span{font-size:1.2rem;color:var(--t3)}
.ring.sm{width:5.6rem;height:5.6rem;margin:0}
.ring.sm circle{stroke-width:3}
.okmark{display:grid;place-items:center;width:6.4rem;height:6.4rem;margin:1.2rem auto 1.6rem;border-radius:50%;background:var(--gl);color:#05210E;animation:pop .6s cubic-bezier(.3,1.6,.5,1) .15s both}
.okmark .li{width:3.2rem;height:3.2rem;stroke-width:2.8}
.center{text-align:center}

/* buying */
.coins{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}
.coins button{display:grid;justify-items:center;gap:.6rem;padding:1.4rem .6rem 1.2rem;border-radius:1.6rem;background:var(--card);box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .3s,background .3s}
.coins button.on{background:var(--card2);box-shadow:inset 0 0 0 1.5px var(--gl)}
.coins .coin{width:4rem;height:4rem;font-size:1.8rem}
.coins .coin .li{width:2.2rem;height:2.2rem}
.coins b{font-weight:600;font-size:1.4rem}
.coins span{font-size:1.1rem;color:var(--t3);font-variant-numeric:tabular-nums}
.amt{margin-top:1.2rem;padding:1.8rem 1.6rem 1.6rem;border-radius:1.6rem;background:var(--field)}
.amt small{font-size:1.3rem;color:var(--t2)}
.amt .v{margin-top:.4rem;font-family:var(--disp);font-weight:600;font-size:4rem;letter-spacing:normal;font-variant-numeric:tabular-nums}
.amt .eq{font-size:1.4rem;color:var(--t2);font-variant-numeric:tabular-nums}
.rng{margin-top:1.6rem;width:100%;height:2.8rem;-webkit-appearance:none;appearance:none;background:transparent}
.rng::-webkit-slider-runnable-track{height:.4rem;border-radius:.4rem;background:linear-gradient(to right,var(--gl) var(--p,3%),rgba(255,255,255,.15) var(--p,3%))}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:2.8rem;height:2.8rem;margin-top:-1.2rem;border-radius:50%;background:#fff;box-shadow:0 .2rem .8rem rgba(0,0,0,.4)}
.rng::-moz-range-track{height:.4rem;border-radius:.4rem;background:rgba(255,255,255,.15)}
.rng::-moz-range-progress{height:.4rem;border-radius:.4rem;background:var(--gl)}
.rng::-moz-range-thumb{width:2.8rem;height:2.8rem;border:0;border-radius:50%;background:#fff}
.quick{margin-top:.8rem;display:flex;gap:.6rem}
.quick button{flex:1;height:3.4rem;border-radius:1rem;background:rgba(255,255,255,.08);font-size:1.3rem;font-weight:600;text-align:center}
.lim .row{padding:1.2rem 1.4rem}
.what{padding:1.4rem}
.what .two{margin-top:1rem;display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.what .two div{padding:1.2rem;border-radius:1.2rem;background:rgba(255,255,255,.06);display:grid;gap:.3rem}
.what .two small{display:flex;align-items:center;gap:.5rem;font-size:1.2rem;color:var(--t2)}
.what .two small .li{width:1.4rem;height:1.4rem}
.what .two b{font-family:var(--disp);font-weight:650;font-size:1.9rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.what .dn small .li{color:#FF6B5A}.what .up small .li{color:var(--gl)}

/* bottom sheet */
.dim{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .35s}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;padding:1rem 1.6rem 3.4rem;border-radius:2.4rem 2.4rem 0 0;background:#1C1C1F;transform:translateY(105%);transition:transform .45s var(--ease)}
.sheet.open{transform:none}.sheet.open~.dim,.dim.open{opacity:1;pointer-events:auto}
.grab{width:3.6rem;height:.5rem;margin:0 auto 1.8rem;border-radius:.4rem;background:rgba(255,255,255,.25)}
.sheet .h1{font-size:2.4rem}
.sheet .facts{margin-top:1.6rem}
.sheet .btn{margin-top:1.2rem}
.sheet .btn+.btn{margin-top:.8rem}

/* ——— technical layer: monospace figures, a measuring grid, live network data ——— */
:root{--mono:"SB Sans Text Mono","SBSansTextMono","SF Mono",ui-monospace,Menlo,monospace;--red:#FF6B5A}
.mono,.row .sum,.amt .v,.ring .in b,.what .two b,.coins span,.amt .eq{font-family:var(--mono);font-feature-settings:"zero" 1;letter-spacing:-.02em}
.amt .v{font-weight:600;font-size:3.6rem}
.ring .in b{font-weight:600;font-size:2.9rem}
.grid{position:absolute;left:0;right:0;top:0;height:40rem;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:2.6rem 2.6rem;background-position:-1px -1px;-webkit-mask-image:linear-gradient(to bottom,#000 10%,transparent 85%);mask-image:linear-gradient(to bottom,#000 10%,transparent 85%)}
.net{margin-top:1.6rem;display:grid;grid-template-columns:1fr 1fr;border-radius:1.2rem;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);background:rgba(0,0,0,.25);font-family:var(--mono);font-size:1.1rem;color:var(--t2)}
.net>div{padding:.9rem 1.1rem;display:grid;gap:.3rem}
.net>div+div{border-left:1px solid rgba(255,255,255,.1)}
.net b{font-weight:500;font-size:1.3rem;color:#fff}
.net .lv{display:flex;align-items:center;gap:.6rem}
.pulse{width:.7rem;height:.7rem;border-radius:50%;background:var(--gl);box-shadow:0 0 0 0 rgba(61,210,108,.6);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 .7rem rgba(61,210,108,0)}100%{box-shadow:0 0 0 0 rgba(61,210,108,0)}}
.tick{animation:tick .6s var(--ease)}
@keyframes tick{from{color:var(--gl)}}

.mk .pth{stroke:var(--gl);stroke-width:1.6;fill:none;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s var(--ease) .35s forwards}

/* live price chart */

/* address check */

/* transaction tracker */
.chain{position:relative;height:11rem;margin:1.4rem -1.6rem 0;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}

.bar{margin-top:1rem;height:.5rem;border-radius:.3rem;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;border-radius:.3rem;background:linear-gradient(90deg,#36B44D,#4FDA69 60%,#32B8D3)}
.tabs{position:absolute;left:0;right:0;bottom:0;z-index:15;display:grid;grid-template-columns:repeat(5,1fr);height:8.3rem;padding:.7rem .4rem 0;background:rgba(14,14,16,.78);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border-top:.5px solid rgba(255,255,255,.1)}
.tabs button{display:grid;justify-items:center;align-content:start;gap:.3rem;font-size:1rem;font-weight:500;color:rgba(255,255,255,.45)}
.tabs .li{width:2.4rem;height:2.4rem;stroke-width:1.8}
.tabs .on{color:var(--gl)}

/* swap */
.sw{position:relative;margin-top:.4rem;display:grid;gap:.6rem}
.sc{position:relative;padding:1.6rem;border-radius:2.2rem;overflow:hidden;background:linear-gradient(150deg,rgba(255,255,255,.1),rgba(255,255,255,.04));box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.sc.get{background:linear-gradient(150deg,rgba(61,210,108,.16),rgba(50,184,211,.08));box-shadow:inset 0 0 0 1px rgba(97,245,124,.35),0 1.6rem 4rem rgba(61,210,108,.14)}
.sc.get::after{content:"";position:absolute;left:10%;right:10%;bottom:-6rem;height:9rem;border-radius:50%;background:radial-gradient(closest-side,rgba(97,245,124,.45),transparent);filter:blur(1.2rem);pointer-events:none}
.sl{font-size:1.3rem;color:var(--t2)}
.sr{margin-top:1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.tp{display:flex;align-items:center;gap:.7rem;height:4.4rem;padding:0 1rem 0 .4rem;border-radius:2.2rem;background:rgba(0,0,0,.4);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);font-size:1.5rem}
.tp .coin{width:3.6rem;height:3.6rem;font-size:1.6rem}
.tp .coin .li{width:2rem;height:2rem}
.tp b{font-weight:600}
.tp>.li{width:1.6rem;height:1.6rem;color:var(--t3)}
.sa{display:grid;justify-items:end;gap:.3rem;min-width:0}
.sa b{font-weight:600;font-size:2.8rem;letter-spacing:normal;white-space:nowrap}
.sa span{font-size:1.2rem;color:var(--t3)}
.pct{margin-top:1.2rem;display:flex;align-items:center;gap:.6rem}
.pct button{height:3rem;padding:0 1.2rem;border-radius:1.5rem;background:rgba(255,255,255,.08);font-size:1.25rem;font-weight:600}
.pct button.on{background:#fff;color:#0B0B0D}
.pct span{margin-left:0;font-size:1.15rem;color:var(--t3)}
.flip{position:absolute;left:50%;top:50%;z-index:2;display:grid;place-items:center;width:4.8rem;height:4.8rem;margin:-2.4rem 0 0 -2.4rem;border-radius:50%;background:#111113;box-shadow:0 0 0 .5rem #000,inset 0 0 0 1px rgba(255,255,255,.16)}
.flip .li{width:2rem;height:2rem}
.flip.spin .li{animation:spin .5s var(--ease)}
@keyframes spin{from{rotate:-180deg}}
.dl{margin-top:1.4rem;padding:.4rem 1.4rem;border-radius:2rem;background:var(--card)}
.dl>div{display:flex;align-items:center;gap:1rem;min-height:4.4rem;font-size:1.4rem;color:var(--t2)}
.dl>div+div{border-top:1px solid var(--line)}
.dl .li{flex:none;width:1.8rem;height:1.8rem;color:var(--t3)}
.dl b{margin-left:auto;font-weight:500;font-size:1.25rem;color:#fff;text-align:right}
.giga{margin-top:.8rem;display:flex;gap:1.2rem;padding:1.6rem;border-radius:2rem;background:linear-gradient(135deg,rgba(54,180,77,.16),rgba(106,87,240,.14));box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.gg{flex:none;display:grid;place-items:center;width:3.6rem;height:3.6rem;border-radius:1.1rem;background:linear-gradient(135deg,#36B44D,#6A57F0);color:#fff}
.gg .li{width:1.9rem;height:1.9rem}
.giga b{font-weight:600;font-size:1.5rem}
.giga p{margin-top:.4rem;font-size:1.35rem;line-height:1.4;color:rgba(255,255,255,.78)}

/* the spotlight on the buy and result screens */
.scr[data-id="buy"] .top,.scr[data-id="swap"] .top{background:none}
.cp.ico{width:4.4rem;padding:0;justify-content:center}
.cp.ico .li{width:1.8rem;height:1.8rem}
.sl{display:flex;justify-content:space-between;gap:1rem}
.sl .mono{font-size:1.15rem;color:var(--t3)}

/* ——— concept «Код подтверждения»: one ring, one texture, green means confirmed ——— */
.ring svg{rotate:none}
.ring path{fill:none;stroke-width:2.4;stroke-linecap:butt}
.ring .sg{stroke:rgba(255,255,255,.1)}
.ring .used{stroke:rgba(255,255,255,.34)}
.ring .fl{stroke:url(#rgu);stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s var(--ease) .15s forwards}
.cfw{position:relative;width:17rem;height:17rem;margin:2rem auto 0}
.cfr{width:100%;height:100%;overflow:visible}
.cfr .sg{fill:none;stroke:rgba(255,255,255,.12);stroke-width:4.2;transition:stroke .45s var(--ease)}
.cfr .sg.on{stroke:url(#rgu)}
.cfr .sgs{transition:opacity .5s ease .25s}
.cfr .mkf{opacity:0;transform-origin:18px 18px;transform:scale(.92);transition:opacity .5s ease,transform .7s cubic-bezier(.3,1.6,.5,1)}
.cfi{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:.2rem;transition:opacity .3s,transform .4s var(--ease)}
.cfi b{font-family:var(--mono);font-weight:600;font-size:5.2rem;line-height:1;letter-spacing:normal}
.cfi span{font-size:1.3rem;color:var(--t3)}
.cfw.done .sgs{opacity:0}
.cfw.done .mkf{opacity:1;transform:none}
.cfw.done .cfi{opacity:0;transform:scale(.8)}
.scr[data-id="tx"] .chain{height:9.4rem;margin-top:.6rem}

/* ════════ Sber Crypto, dark: black canvas, graphite sections, green only for what is yours or confirmed ════════ */
:root{--L-bg:#000;--L-ink:#fff;--L-t2:rgba(255,255,255,.6);--L-t3:rgba(255,255,255,.38);--L-line:rgba(255,255,255,.08);--L-gt:#3DD26C;--L-gr:#2C2C2F;--S1:#151517;--S2:#222225;--S3:#333337}
.stage{background:radial-gradient(60% 50% at 50% 40%,#0B1610 0%,#050506 70%)}
.cap{color:rgba(255,255,255,.38)}
.ph{background:#000;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 0 0 .9rem #151517,0 0 0 1rem rgba(255,255,255,.08),0 40px 120px rgba(0,0,0,.6)}
.sb{color:#fff}.sb svg{fill:#fff}.sb svg rect[fill="none"]{stroke:#fff}
.ph.dk .sb{color:#fff}.ph.dk .sb svg{fill:#fff}.ph.dk .sb svg rect[fill="none"]{stroke:#fff}
.home-ind{background:rgba(255,255,255,.85)}.ph.dk .home-ind{background:rgba(255,255,255,.85)}
.scr:not(.qs){--bg:var(--L-bg);--t2:var(--L-t2);--t3:var(--L-t3);--line:var(--L-line);--card:var(--S1);--card2:var(--S2);--field:var(--S2);background:var(--L-bg);color:var(--L-ink)}
.scr[data-id="hub"]{background:var(--L-bg)}
.scr:not(.qs) .top{background:linear-gradient(to bottom,var(--L-bg) 62%,rgba(0,0,0,0))}
.scr:not(.qs) .foot{background:linear-gradient(to top,var(--L-bg) 70%,rgba(0,0,0,0))}
.scr:not(.qs) .top .ib[data-back]{background:none;color:var(--L-ink);width:4.4rem;height:4.4rem}
.scr:not(.qs) .top .ib{color:var(--L-ink)}
.ib0{display:grid;place-items:center;width:4.4rem;height:4.4rem;color:var(--L-ink)}
.ib0 .li{width:2.4rem;height:2.4rem}
.ib0.sm{width:3.2rem;height:3.2rem;border-radius:1rem;background:var(--S2)}.ib0.sm .li{width:1.8rem;height:1.8rem}
.scr:not(.qs) .h1{color:var(--L-ink)}
.scr:not(.qs) .btn.s{background:var(--S3);color:var(--L-ink)}
.btn.gr{background:var(--L-gr);color:#fff}
.scr:not(.qs) .btn.w{background:var(--L-gr);color:#fff}
.scr:not(.qs) .chip{background:var(--S2);color:var(--L-ink)}
.scr:not(.qs) .chip.g{background:rgba(33,160,56,.12);color:var(--L-gt)}
.scr:not(.qs) .dlt.u,.scr:not(.qs) .tday.u{color:var(--L-gt)}
.scr:not(.qs) .tile{color:#fff}
.scr:not(.qs) .facts .tile{background:var(--S2);color:var(--L-ink)}
.scr:not(.qs) .row .end .li{color:var(--L-t3)}
.scr:not(.qs) .card{background:var(--S1)}

/* wallet home */
.wp{display:none;position:absolute;left:0;right:0;top:0;height:36rem;z-index:0;pointer-events:none;background:radial-gradient(80% 60% at 15% 0%,#9ED3CC 0%,rgba(158,211,204,0) 70%),radial-gradient(70% 60% at 95% 10%,#BFE8C9 0%,rgba(191,232,201,0) 70%),linear-gradient(to bottom,#B9E0D6 0%,#D9EFE4 45%,rgba(0,0,0,0) 100%)}
.scr[data-id="hub"] .top{background:none}
.sbtop{display:flex!important;align-items:center;gap:1rem;padding:5.4rem 1.6rem 0;height:11rem}
.sq{flex:none;display:grid;place-items:center;width:4.4rem;height:4.4rem;border-radius:1.2rem;background:var(--S2);color:var(--L-ink)}
.sq .li{width:2.2rem;height:2.2rem}
.srch{flex:1;display:flex;align-items:center;gap:.8rem;height:4.4rem;padding:0 1.2rem;border-radius:1.2rem;background:var(--S2);font-size:1.6rem;color:var(--L-t2)}
.srch .li{width:2rem;height:2rem}
.ttl{display:flex;align-items:center;justify-content:space-between;margin-top:.6rem}
.ttl h1{font-family:var(--disp);font-weight:600;font-size:2.8rem;letter-spacing:-.02em}
.ttl span{display:flex;margin-right:-1rem}
.tl1{margin-top:1.4rem;font-size:1.5rem;color:var(--L-t2)}
.tsum{display:flex;align-items:center;margin-top:.2rem;font-size:3rem;color:var(--L-ink)}
.tsum em{color:rgba(255,255,255,.4)}
.tsum .li{width:2.2rem;height:2.2rem;margin-left:.4rem;color:rgba(255,255,255,.4)}
.tday{margin-top:.4rem;font-family:var(--ui);font-size:1.3rem;font-weight:500}
.scr[data-id="hub"] .tday:not(.u):not(.d){color:var(--L-t2)}
.hidebal .tsum span,.hidebal .tsum em,.hidebal .hb,.hidebal .hs,.hidebal .tr-r,.hidebal .tday{filter:blur(.9rem);transition:filter .3s}
.car{margin-top:1.8rem}
.hero{box-shadow:none}
.gc{background:var(--S1);box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;color:var(--L-ink)}
.gc::before{opacity:.5;filter:blur(3.4rem)}
.gi{background:var(--S2);color:var(--L-ink)}
.gc b{color:var(--L-ink)}
.gb{background:var(--L-gr);color:#fff}
.dots i{background:rgba(255,255,255,.22)}.dots i.on{background:var(--L-ink)}
.sec{margin-top:1.2rem;padding:1.8rem 1.6rem;border-radius:2.4rem;background:var(--S1)}
.sh{display:flex;align-items:center;justify-content:space-between;min-height:3.2rem}
.sh b{font-family:var(--disp);font-weight:600;font-size:2.2rem;letter-spacing:-.02em}
.qt{margin-top:1.4rem;display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
.qt button{display:grid;justify-items:center;align-content:start;gap:.8rem;font-size:1.3rem;line-height:1.25;color:var(--L-ink);text-align:center}
.qt span{display:grid;place-items:center;width:100%;aspect-ratio:1;border-radius:1.8rem;background:var(--S2);transition:transform .15s}
.qt button:first-child span{background:#21A038;color:#fff}
.qt button:active span{transform:scale(.95)}
.qt .li{width:2.6rem;height:2.6rem}
.trows{margin-top:.6rem}
.trow{padding:1.2rem 0}
.trow+.trow{border-top:1px solid var(--L-line)}
.trow .tx b{font-family:var(--ui);font-weight:500;font-size:1.6rem;letter-spacing:0;color:var(--L-ink)}
.trow .tx span{font-family:var(--ui);font-size:1.3rem;color:var(--L-t2)}
.tr-r{font-weight:500;font-size:1.6rem;color:var(--L-ink);font-variant-numeric:tabular-nums}
.trow .dlt{font-family:var(--ui);font-size:1.2rem}
.trow .dlt.d{color:#FF6B6F}
.tiles{margin-top:1.2rem;gap:1.2rem}
.tl{gap:.6rem;padding:1.6rem;border-radius:2.4rem;background:var(--S1);box-shadow:none}
.tt{font-family:var(--ui);font-weight:400;font-size:1.5rem;letter-spacing:0;color:var(--L-t2)}
.tv b{font-family:var(--ui);font-weight:500;font-size:2.2rem;letter-spacing:-.01em;color:var(--L-ink)}
.bar{margin-top:.6rem;background:var(--S3)}
.bar i{background:#21A038}
.tsub{font-size:1.25rem;color:var(--L-t2)}
.hotcold{margin-top:1.2rem;background:var(--S2);box-shadow:none;border-radius:1.8rem}
.hotcold>div+div{border-left:1px solid var(--S3)}
.hotcold b{color:var(--L-ink)}
.trust{margin-top:1.2rem;background:var(--S1);box-shadow:none}
.trust .tile{background:rgba(33,160,56,.12);color:var(--L-gt)}
.trust .lnk{color:var(--L-gt);border-top-color:var(--L-line)}
.trust .lnk .li:last-child{color:var(--L-t3)}
.seg{background:var(--S2)}
.seg button{color:var(--L-t2)}
.seg button.on{background:#48484D;color:#fff;box-shadow:none}
.cmp{margin-top:1.2rem;padding:0;background:none!important}
.cmp .v.n i{background:var(--S2);color:var(--L-t3)}
.cmp .v.y i{background:rgba(33,160,56,.12);color:var(--L-gt)}
.cmp .v.w i{background:rgba(255,160,0,.14);color:#D98500}
.note{color:var(--L-t3)}
.tabs{background:rgba(14,14,16,.82);border-top:.5px solid rgba(255,255,255,.08)}
.tabs button{color:rgba(255,255,255,.4);font-size:1.05rem}
.tabs svg{width:2.6rem;height:2.6rem}
.tabs .on{color:#3DD26C}

/* product page */
.ontop{position:absolute!important;left:0;right:0;top:0;z-index:5;background:none!important}
.scr:not(.qs) .ontop .ib[data-back],.ib0.wt{color:#fff}
.pbody{padding-top:0}
.phero{position:relative;margin:0 -1.6rem;height:46rem;border-radius:0 0 3.2rem 3.2rem;overflow:hidden;background:radial-gradient(70% 50% at 50% 40%,#06140B 0%,#000 70%)}
.mart{position:absolute;inset:0;width:100%;height:100%}
.pht{position:absolute;left:0;right:0;bottom:3rem;text-align:center;color:#fff}
.pht .h1{color:#fff!important;font-size:3.2rem}
.pht p:last-child{margin:.8rem auto 0;max-width:30rem;font-size:1.5rem;line-height:1.4;color:rgba(255,255,255,.82)}
.seg2{margin-top:1.6rem;background:var(--S1)}
.seg2 button{height:4.4rem;font-size:1.5rem}
.seg2 button.on{background:#fff;color:#0B0B0D;box-shadow:none}
.plist{margin-top:1.2rem;padding:0 1.6rem;border-radius:2.4rem;background:var(--S1)}
.plist>div{display:flex;justify-content:space-between;align-items:center;gap:1.2rem;min-height:7.2rem;padding:1.2rem 0;font-size:1.6rem;line-height:1.3}
.plist>div+div{border-top:1px solid var(--L-line)}
.pv{display:grid;justify-items:end;text-align:right}
.pv b{font-family:var(--disp);font-weight:600;font-size:2rem}
.pv small{font-size:1.3rem;color:var(--L-t2)}

/* the rest of the flow on light */
.scr:not(.qs) .pc,.scr:not(.qs) .what,.scr:not(.qs) .dl,.scr:not(.qs) .kv,.scr:not(.qs) .steps,.scr:not(.qs) .hash,.scr:not(.qs) .addr,.scr:not(.qs) .card.facts{background:var(--S1)}
.amt{background:var(--S1)}
.coins button{background:var(--S1)}
.coins button.on{background:var(--S1);box-shadow:inset 0 0 0 1.5px #3DD26C}
.what .two div{background:var(--S2)}
.what .dn small .li{color:#FF6B6F}
.quick button{background:var(--S2);color:var(--L-ink)}
.quick button.on{background:var(--L-gr);color:#fff}
.rng::-webkit-slider-runnable-track{background:linear-gradient(to right,#21A038 var(--p,3%),var(--S3) var(--p,3%))}
.rng::-webkit-slider-thumb{box-shadow:0 .2rem .8rem rgba(0,0,0,.2),0 0 0 1px rgba(0,0,0,.06)}
.pc .l{stroke-width:1.8}
.pc .gl{stroke:rgba(255,255,255,.06)}
.pc .tf button{color:var(--L-t2)}.pc .tf button.on{background:var(--S2);color:var(--L-ink)}
.ring .sg,.cfr .sg{stroke:var(--S3)}
.ring .used{stroke:rgba(255,255,255,.3)}
.cfi span{color:var(--L-t2)}
.okmark{background:#21A038;color:#fff;box-shadow:0 0 0 .8rem rgba(33,160,56,.14)}
.scr:not(.qs) .wall{display:none}
.chunks span{background:var(--S2);color:var(--L-ink)}
.chunks span.m{background:rgba(33,160,56,.12);color:var(--L-gt)}
.chunks span.x{background:rgba(229,72,77,.18);color:#FF6B6F}
.warn{background:rgba(229,72,77,.12)}.warn .li{color:#FF6B6F}
.addr.bad{box-shadow:inset 0 0 0 1.5px rgba(229,72,77,.55)}.addr.good{box-shadow:inset 0 0 0 1.5px rgba(33,160,56,.5)}
.chain .rail{background:repeating-linear-gradient(90deg,rgba(255,255,255,.22) 0 .4rem,transparent .4rem .8rem)}
.chain .blk{background:var(--S1);box-shadow:inset 0 0 0 1px var(--S3);color:var(--L-t3)}
.chain .blk b{color:var(--L-t2)}
.chain .blk.me{background:rgba(33,160,56,.1);box-shadow:inset 0 0 0 1.5px #21A038}.chain .blk.me b{color:var(--L-gt)}
.steps i{box-shadow:inset 0 0 0 1.5px var(--S3)}
.steps .d,.steps .a{color:var(--L-ink)}
.steps .d i{background:#21A038;color:#fff}
.steps .a i{border-color:#21A038}
.hash b{color:var(--L-ink)}
.sc{background:var(--S1);box-shadow:none}
.sc.get{background:var(--S1);box-shadow:inset 0 0 0 1.5px #21A038,0 1.2rem 3rem rgba(33,160,56,.12)}
.sc.get::after{display:none}
.tp{background:var(--S2);box-shadow:none}
.flip{background:var(--S2);box-shadow:0 0 0 .5rem var(--L-bg);color:var(--L-ink)}
.dl b{color:var(--L-ink)}
.giga{background:var(--S1);box-shadow:none}
.giga p{color:var(--L-t2)}
.sheet{background:var(--S1);color:var(--L-ink)}
.sheet .h1{color:var(--L-ink)}
.sheet .lead{color:var(--L-t2)}
.sheet .card,.sheet .kv{background:var(--S2)}
.sheet .facts .tile{background:var(--S1);color:var(--L-ink)}
.sheet .btn.s{background:var(--S3);color:var(--L-ink)}
.sheet .kv>div{color:var(--L-t2)}.sheet .kv b{color:var(--L-ink)}
.sheet .kv>div+div{border-top-color:var(--S3)}
.grab{background:rgba(255,255,255,.22)}
.mk{background:var(--S2);box-shadow:none}
.mk text{fill:rgba(255,255,255,.5)}
.mk .nd{fill:var(--S1);stroke:rgba(255,255,255,.14)}
.mk .ed{stroke:rgba(255,255,255,.14)}
.mk .on .nd{fill:rgba(33,160,56,.1);stroke:#21A038}.mk .on text{fill:var(--L-ink)}
.mk .pth{stroke:#21A038}
.mk .you .nd{fill:#21A038}.mk .you text{fill:#fff}
#toast{background:#fff;color:#0B0B0D}
.lead{color:var(--L-t2)}
.scr[data-id="hub"] .sbtop{background:rgba(0,0,0,.62);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4)}
.seg2{grid-template-columns:1fr 1fr}
.seg2 button{white-space:nowrap}
.btn{color:#fff}
.scr:not(.qs) .row .sum,.scr:not(.qs) .kv b,.scr:not(.qs) .dl b,.scr:not(.qs) .hash b{color:var(--L-ink)}
.scr:not(.qs) .kv>div+div{border-top-color:var(--L-line)}
.scr:not(.qs) .coin{color:#fff}
.scr:not(.qs) .trust .tile{color:var(--L-gt)}

/* ——— Sber Crypto, dark details ——— */
.scr:not(.qs) .card,.sheet .card{background:var(--S1)}
.qt{display:flex;justify-content:space-between;gap:0;margin-top:1.4rem}
.qt button{width:7.2rem;gap:.7rem;font-size:1.2rem;font-weight:500;color:rgba(255,255,255,.82)}
.qt span{width:5.2rem;height:5.2rem;aspect-ratio:auto;border-radius:1.6rem;background:var(--S2)}
.qt .li{width:2.2rem;height:2.2rem;stroke-width:1.9}
.qt button:first-child span{background:#21A038;color:#fff}

/* coins: the original marks */
.coin.lg{background:none!important;box-shadow:none!important;padding:0}
.coin.lg svg{display:block;width:100%;height:100%}
.coin.big{width:8rem;height:8rem;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}

/* the living card */
.car{margin-top:1.8rem}
.car>.cardp{flex:none;width:31.4rem;scroll-snap-align:start}
.cardp{position:relative;aspect-ratio:314/198;border-radius:2rem;overflow:hidden;isolation:isolate;color:#fff;background:linear-gradient(140deg,#0F3E2E 0%,#072019 52%,#0B3428 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09),0 1.6rem 3.6rem rgba(0,0,0,.55);transition:transform .5s var(--ease);will-change:transform;--mx:70%;--my:20%}
.cardp.hov{transition:transform .12s linear}
.cg{position:absolute;inset:-25%;filter:blur(2.4rem);opacity:.55;transition:opacity 1.2s ease}
.lv1 .cg{opacity:1}
.cg i{position:absolute;border-radius:50%;mix-blend-mode:screen}
.cg .b1{width:62%;height:70%;left:38%;top:0;background:radial-gradient(closest-side,#45FF8F,rgba(69,255,143,0));animation:bl1 10s ease-in-out infinite alternate}
.cg .b2{width:58%;height:64%;left:2%;top:38%;background:radial-gradient(closest-side,#13C49C,rgba(19,196,156,0));animation:bl2 13s ease-in-out infinite alternate}
.cg .b3{width:48%;height:56%;left:56%;top:46%;background:radial-gradient(closest-side,#1E9F5F,rgba(30,159,95,0));animation:bl3 9s ease-in-out infinite alternate}
.cg .b4{width:34%;height:40%;left:20%;top:8%;background:radial-gradient(closest-side,#2EB6D6,rgba(46,182,214,0));opacity:.55;animation:bl4 15s ease-in-out infinite alternate}
@keyframes bl1{to{transform:translate(-26%,22%) scale(1.15)}}
@keyframes bl2{to{transform:translate(30%,-18%) scale(.85)}}
@keyframes bl3{to{transform:translate(-34%,-24%) scale(1.2)}}
@keyframes bl4{to{transform:translate(60%,40%) scale(1.3)}}
.sheen{position:absolute;inset:0;background:linear-gradient(112deg,transparent 35%,rgba(255,255,255,.13) 48%,transparent 60%);transform:translateX(-130%);animation:sheen 8s ease-in-out 1.2s infinite;pointer-events:none}
@keyframes sheen{0%,72%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.grain2{position:absolute;inset:0;opacity:.18;mix-blend-mode:overlay;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.glare{position:absolute;inset:0;opacity:0;transition:opacity .3s;pointer-events:none;background:radial-gradient(40% 50% at var(--mx) var(--my),rgba(255,255,255,.16),transparent 70%)}
.cardp.hov .glare{opacity:1}
.cmk{position:absolute;left:1.8rem;top:1.7rem;width:2.6rem;height:2.7rem}
.cmk svg{display:block;width:100%;height:100%}
.cnm{position:absolute;right:1.8rem;bottom:1.9rem;font-family:var(--disp);font-weight:600;font-size:1.5rem;letter-spacing:-.01em;color:rgba(255,255,255,.88)}
.camt{position:absolute;left:1.8rem;right:1.8rem;top:6.2rem;display:grid;gap:.4rem}
.camt b{font-family:var(--disp);font-weight:600;font-size:3.4rem;line-height:1;letter-spacing:normal;white-space:nowrap;font-variant-numeric:tabular-nums}
.camt span{font-size:1.5rem;color:rgba(255,255,255,.72);font-variant-numeric:tabular-nums}
.cadr{position:absolute;left:1.4rem;bottom:1.4rem;display:flex;align-items:center;gap:.6rem;height:3rem;padding:0 .9rem 0 1.1rem;border-radius:1.5rem;background:rgba(0,0,0,.28);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-family:var(--mono);font-size:1.2rem;color:rgba(255,255,255,.82);transition:background .2s}
.cadr:active{background:rgba(0,0,0,.45)}
.cadr .li{width:1.4rem;height:1.4rem;color:rgba(255,255,255,.7)}
.hidebal .camt b,.hidebal .camt span{filter:blur(.9rem);transition:filter .3s}
.gc{aspect-ratio:314/198}

/* splash */
#splash{position:absolute;inset:0;z-index:60;width:100%;height:100%;display:none;background:#000;border-radius:inherit;cursor:pointer}
#splash.on{display:block}
#splash.out{opacity:0;transform:scale(1.04);transition:opacity .55s ease,transform .6s var(--ease)}

/* icon hygiene: one stroke, no fills leaking, everything optically centred */
.li{overflow:visible}
.tile .li,.facts .tile .li,.hc-i .li,.gi .li{stroke-width:2}
.tabs svg{display:block}
.row .end .li,.tt .li{stroke-width:2}
.dl .li{stroke-width:1.8}
.cmp .v i{font-weight:600;font-size:1.3rem;font-style:normal}
.scr:not(.qs) .dlt.u,.scr:not(.qs) .tday.u{color:#3DD26C}
.seg2 button{font-size:1.35rem;padding:0 .6rem;overflow:hidden;text-overflow:ellipsis}
.mart{filter:drop-shadow(0 0 1.4rem rgba(61,210,108,.28))}
.phero{background:#000}

/* ═══════ the grid: 16 side margin · 12 between blocks · 16 inside blocks · radii 24 / 16 / 12 / pill · rows 52 ═══════ */
:root{--pad:1.6rem;--gap:1.2rem;--rl:2.4rem;--rm:1.6rem;--rs:1.2rem;--row:5.2rem}
/* blocks */
.sec,.tl,.plist,.scr .card,.kv,.dl,.steps,.addr,.pc,.amt,.what,.trust,.warn,.giga,.sc,.mk,.coins button,.gc,.vok,.menu{border-radius:var(--rl)}
.sec,.tl,.pc,.amt,.what,.addr,.warn,.giga,.sc{padding:var(--pad)}
.sec,.tiles,.trust,.plist,.seg2,.pc,.coins,.amt,.what,.addr,.warn,.kv,.dl,.steps,.hash,.giga,.sc+.sc,.vok,.menu,.mk,.qrw{margin-top:var(--gap)!important}
.sw{margin-top:0}.sw .sc+.sc{margin-top:0!important}.sw{gap:var(--gap)}
.scr .body>:first-child,.pbody>.phero,.sheet .grab+*{margin-top:0!important}
.scr:not([data-id="hub"]):not([data-id="cr-intro"]) .body{padding-top:.4rem}
.tiles{gap:var(--gap)}
.coins{gap:var(--gap)}
/* lists: no side padding on rows, the block holds it; dividers inset to the text */
.kv,.dl,.steps,.plist{padding:0 var(--pad)}
.kv>div,.dl>div,.steps>div{min-height:var(--row);padding:0}
.kv>div{align-items:center;font-size:1.4rem}
.kv b,.dl b{font-size:1.3rem}
.plist>div{min-height:6.4rem}
.kv>div+div,.dl>div+div,.steps>div+div,.plist>div+div,.trow+.trow{border-top:1px solid var(--line)}
.trows{margin:0;padding:0}
.trow{min-height:6.4rem;padding:0}
.sec .sh+*{margin-top:var(--gap)!important}
/* single-line rows */
.hash{width:100%;min-height:var(--row);padding:0 var(--pad);border-radius:var(--rm);text-align:left}
.btn{height:5.6rem;border-radius:var(--rm)}
.foot .btn+.btn,.sheet .btn+.btn{margin-top:.8rem}
.sheet .btn{margin-top:var(--gap)}
/* controls */
.seg{border-radius:var(--rs);padding:.3rem}.seg button{border-radius:.9rem}
.seg2 button{height:4.4rem}
.quick button{height:4rem;border-radius:var(--rs)}
.pc .tf button{height:3.2rem;border-radius:1rem}
.what .two{gap:.8rem}.what .two div{border-radius:var(--rm);padding:1.2rem}
.hotcold{border-radius:var(--rm)}
.chunks{gap:.6rem}.chunks span{height:3.2rem;border-radius:.8rem}
.tp{height:4.4rem;border-radius:2.2rem}
.cadr{height:3.2rem;border-radius:1.6rem}
/* icon tiles: one size everywhere */
.tile,.trust .tile,.facts .tile,.hc-i,.menu .tile{width:4rem;height:4rem;border-radius:var(--rs)}
.tile .li,.trust .tile .li,.facts .tile .li,.hc-i .li,.menu .tile .li{width:2rem;height:2rem}
.trust .row,.facts .row{padding:var(--pad);gap:1.2rem;align-items:flex-start}
.trust .lnk{min-height:var(--row);padding:0 var(--pad)}
.row .tx b,.trust .tx b{font-size:1.5rem;line-height:1.3;font-weight:600}
.row .tx span,.trust .tx span{font-size:1.3rem}
/* type scale: 28 screen · 22 section · 16 body · 13 secondary · 12 caption */
.h1{font-size:2.8rem;line-height:1.15}
.sheet .h1{font-size:2.2rem;line-height:1.2}
.sh b,.tt2{font-size:2.2rem}
.what>b,.giga b,.warn b,.addr .who,.vok b{font-size:1.5rem;font-weight:600}
.small,.lead{line-height:1.4}
.sheet .lead{margin-top:.6rem;font-size:1.4rem}
.note{font-size:1.2rem;margin-top:2rem}
/* the sheet */
.sheet{padding:.8rem var(--pad) 3.4rem;border-radius:2.4rem 2.4rem 0 0;max-height:88%;overflow-y:auto;scrollbar-width:none}
.grab{margin-bottom:1.6rem}
.shd{display:flex;align-items:center;gap:1.2rem}
.shd .h1{margin:0}
.sava{display:grid;place-items:center;width:5.6rem;height:5.6rem;border-radius:var(--rm);background:var(--S2)}
.sava .li{width:2.6rem;height:2.6rem}
.shd .gg{width:5.6rem;height:5.6rem;border-radius:var(--rm)}
.shd .gg .li{width:2.6rem;height:2.6rem}
.menu{background:var(--S2);padding:0 var(--pad)}
.menu button{display:flex;align-items:center;gap:1.2rem;width:100%;min-height:6rem;font-size:1.6rem;text-align:left}
.menu button+button{border-top:1px solid var(--line)}
.menu button>.li{margin-left:auto;width:1.8rem;height:1.8rem;color:var(--t3)}
.menu .tile{background:var(--S3);color:#fff}
.gq{margin-top:var(--gap);display:flex;flex-wrap:wrap;gap:.8rem}
.gq button{height:4rem;padding:0 1.4rem;border-radius:2rem;background:var(--S2);font-size:1.4rem;transition:background .2s,color .2s}
.gq button.on{background:#fff;color:#0B0B0D}
.gbub{margin-top:var(--gap);display:flex;gap:1.2rem;padding:var(--pad);border-radius:var(--rl);background:var(--S2)}
.gbub .gg{flex:none;width:3.6rem;height:3.6rem;border-radius:1.1rem}
.gbub p{font-size:1.5rem;line-height:1.45;min-height:6.5rem}
.qrw{display:grid;place-items:center;padding:var(--pad);border-radius:var(--rl);background:var(--S2)}
.qrw svg{width:20rem;height:20rem;display:block}
.vok{display:flex;gap:1.2rem;align-items:flex-start;padding:var(--pad);background:rgba(61,210,108,.12);animation:rise .4s var(--ease)}
.vok .li{flex:none;width:2.2rem;height:2.2rem;color:#3DD26C}
.vok b{display:block;margin-bottom:.3rem}.vok span{font-size:1.3rem;line-height:1.4;color:var(--t2)}
.vok.bad{background:rgba(255,107,111,.12)}.vok.bad .li{color:#FF6B6F}
.sheet .vok+.btn{margin-top:var(--gap)}
.kv.hl>div{min-height:6.4rem}
.hli{display:flex;align-items:center;gap:1.2rem}
.hli .coin{width:3.6rem;height:3.6rem}
.hli>span{display:grid;gap:.2rem}.hli b.nb{font-family:var(--ui);font-weight:500;font-size:1.5rem;color:#fff}
.hli small,.hlr small{font-size:1.2rem;color:var(--t2);font-family:var(--ui)}
.hlr{display:grid;justify-items:end;gap:.2rem}
/* the wallet home */
.tsum{background:none;padding:0;font-family:inherit;text-align:left}
.tsum span{font-family:var(--disp);font-weight:600;font-size:3rem;letter-spacing:-.02em}
.tsum em{font-family:var(--disp);font-weight:600;font-size:3rem;letter-spacing:-.02em}
.ttl{margin-top:.4rem;min-height:4.4rem}
.tl1{margin-top:.8rem}
.car{margin-top:var(--pad)}
.dots{margin-top:1rem}
.dots+.sec{margin-top:1.2rem!important}
.qt{margin-top:var(--gap)}
.trow .coin{width:4rem;height:4rem}
.tl{gap:.4rem}
.tl .bar{margin-top:.8rem}
.trust{padding:0}
/* the chart scrub */
.pc svg{touch-action:none;cursor:crosshair}
.scrub line{stroke:rgba(255,255,255,.4);stroke-width:1;stroke-dasharray:2 3;vector-effect:non-scaling-stroke}
.scrub circle{fill:#fff;stroke:#3DD26C;stroke-width:2;vector-effect:non-scaling-stroke}
/* pressed states, the same on everything that is a button */
.sec button,.tl,.coins button,.hash,.menu button,.gq button,.trow,.cadr,.tsum,.qa,.qt button,.ib0,.sq,.srch,.tp,.lnk{transition:transform .16s var(--ease),opacity .2s,background .2s}
.tl:active,.coins button:active,.hash:active,.menu button:active,.trow:active,.lnk:active,.tsum:active{opacity:.7}
.ib0:active,.sq:active,.srch:active,.tp:active,.cadr:active{transform:scale(.95);opacity:.8}
button:focus-visible{outline:2px solid #3DD26C;outline-offset:2px}
.btn[disabled]{opacity:.5}
.kv.hl .hlr{margin-left:auto;text-align:right}
.kv.hl>div{display:flex;justify-content:space-between}

/* ═══════ Sber Plasma type, mobile scale ═══════ */
.ph{letter-spacing:-.02em}
.h1,.pht .h1,.scr:not(.qs) .h1{font-family:var(--disp);font-weight:600;font-size:2.8rem;line-height:3.4rem;letter-spacing:normal}
.sheet .h1{font-size:2rem;line-height:2.6rem}
.sh b,.tt2{font-family:var(--disp);font-weight:600;font-size:2rem;line-height:2.6rem;letter-spacing:normal}
.top h2{font-family:var(--ui);font-weight:600;font-size:1.6rem;line-height:2.2rem;letter-spacing:normal}
.lead,.sheet .lead{font-size:1.4rem;line-height:1.8rem}
.small,.tsub,.gs,.sn{font-size:1.4rem;line-height:1.8rem}
.note{font-size:1.2rem;line-height:1.4rem}
.btn{font-weight:600;font-size:1.6rem;letter-spacing:normal}
.kv>div,.dl>div,.steps>div,.plist>div{font-size:1.6rem;line-height:2rem}
.kv b,.dl b,.steps em{font-weight:500;font-size:1.4rem;line-height:1.8rem}
.row .tx b,.trust .tx b,.trow .tx b,.menu button{font-weight:500;font-size:1.6rem;line-height:2rem}
.row .tx span,.trust .tx span,.trow .tx span{font-size:1.4rem;line-height:1.8rem}
.tsum span,.tsum em{font-family:var(--disp);font-weight:600;font-size:2.8rem;line-height:3.4rem;letter-spacing:normal}
.tl1{font-size:1.4rem;line-height:1.8rem;margin:0}
.tday{font-size:1.4rem;line-height:1.8rem}
.tv b{font-family:var(--disp);font-weight:500;font-size:2rem;line-height:2.6rem}
.tt{font-size:1.4rem;line-height:1.8rem}
.pv b{font-family:var(--disp);font-weight:600;font-size:1.8rem;line-height:2.4rem}
.pv small{font-size:1.2rem;line-height:1.4rem}
.qfact{font-weight:600;font-size:2.4rem;line-height:3rem;letter-spacing:normal}
.qwhy{font-size:1.6rem;line-height:2.2rem}
.qq p{font-weight:600;font-size:1.6rem;line-height:2.2rem}
.cfi b{font-weight:600;font-size:4rem}
.amt .v{font-weight:600;font-size:3.2rem;letter-spacing:-.02em}
.ring .in b{font-weight:600}
.pc .px{font-weight:600;font-size:2rem}
.sa b{font-weight:600;font-size:2.4rem}
.gc b{font-weight:600;font-size:2.4rem;letter-spacing:normal}
.qt button{font-size:1.2rem;line-height:1.4rem}
.tabs button{font-size:1rem;line-height:1.2rem;font-weight:500}

/* hub header row */
.ttl{display:flex;align-items:center;justify-content:space-between;margin-top:.8rem;min-height:4.4rem}
.ttl+.tsum{margin-top:0}

/* the card: bigger, darker, a deeper green moving under glass, a lighter type */
.car>.cardp{width:calc(100% - 2.8rem)}
.car>.cardp:only-child{width:100%}
.cardp{aspect-ratio:1.586;border-radius:2.4rem;background:linear-gradient(150deg,#062519 0%,#020D09 55%,#041A12 100%)}
.cg{opacity:.4;filter:blur(3rem)}
.lv1 .cg{opacity:.85}
.cg .b1{width:46%;height:60%;left:46%;top:-6%;background:radial-gradient(closest-side,#36E07A,rgba(54,224,122,0))}
.cg .b2{width:42%;height:52%;left:4%;top:44%;background:radial-gradient(closest-side,#0FA885,rgba(15,168,133,0))}
.cg .b3{width:36%;height:46%;left:62%;top:52%;background:radial-gradient(closest-side,#178A50,rgba(23,138,80,0))}
.cg .b4{width:28%;height:34%;left:24%;top:6%;background:radial-gradient(closest-side,#2AA8C8,rgba(42,168,200,0));opacity:.5}
.cardp::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 80% at 50% 120%,rgba(0,0,0,.55),transparent 60%);z-index:0}
.cardp>*{z-index:1}
.cmk{left:2rem;top:2rem;width:2.8rem;height:2.9rem}
.cnm{right:2rem;bottom:2.2rem;font-family:var(--ui);font-weight:500;font-size:1.4rem;line-height:1.8rem;color:rgba(255,255,255,.7)}
.camt{left:2rem;right:2rem;top:auto;bottom:6.4rem;gap:.2rem}
.camt b{font-family:var(--disp);font-weight:500;font-size:2.8rem;line-height:3.4rem;letter-spacing:normal}
.camt span{font-size:1.4rem;line-height:1.8rem;color:rgba(255,255,255,.6)}
.cadr{left:1.6rem;bottom:1.6rem;height:3.2rem;background:rgba(255,255,255,.08);font-size:1.2rem;color:rgba(255,255,255,.75)}
.gc{width:calc(100% - 2.8rem)}

/* the official mark on the pass screen */
.okmark{width:7.2rem;height:7.2rem;margin:1.2rem auto 2rem;background:none!important;box-shadow:none!important;border-radius:0}
.okmark svg{width:100%;height:100%}

/* the transfer: air between the mark and its caption */
.cfw{margin:2.4rem auto 0;width:16rem;height:16rem}
#cfT{margin-top:2rem;font-size:1.4rem;line-height:1.8rem}
.chain .blk b{font-family:var(--ui);font-size:1.1rem;line-height:1.3rem}

/* review sheets */
.cfh{display:flex;align-items:center;gap:1.2rem;margin-top:var(--gap);padding:var(--pad);border-radius:var(--rl);background:var(--S2)}
.cfh .coin,.cfh .idc{width:4.8rem;height:4.8rem;border-radius:50%}
.cfh .idc{border-radius:1.2rem}
.cfh b{display:block;font-family:var(--disp);font-weight:600;font-size:2rem;line-height:2.6rem;letter-spacing:normal}
.cfh span:not(.coin):not(.idc){font-size:1.4rem;line-height:1.8rem;color:var(--t2)}
.sheet .kv{background:var(--S2)}
.sn{margin-top:var(--gap);color:var(--t3)}
[data-qt].late{color:#FF6B6F}
.btn .li{width:2.2rem;height:2.2rem}

/* the chart */
.pcw{position:relative;margin-top:1.2rem}
.pc svg{height:12rem;margin-top:0}
.pc .l{stroke:#3DD26C;stroke-width:2;vector-effect:non-scaling-stroke;fill:none;stroke-linejoin:round;stroke-linecap:round}
.pc .a{fill:url(#pcg);opacity:.7}
.pc .base{stroke:rgba(255,255,255,.22);stroke-width:1;stroke-dasharray:2 4;vector-effect:non-scaling-stroke}
.pc .dot{fill:#3DD26C}
.pc .halo{fill:rgba(61,210,108,.25);animation:halo 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes halo{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}
.pclab{position:absolute;inset:0;pointer-events:none}
.pclab span{position:absolute;transform:translate(-50%,-150%);font-family:var(--mono);font-size:1.1rem;line-height:1.4rem;color:var(--t3);white-space:nowrap}
.pclab span:last-child{transform:translate(-50%,60%)}
.pc .tf{margin-top:1.2rem;display:grid;grid-template-columns:repeat(4,1fr);gap:.2rem;padding:.3rem;border-radius:var(--rs);background:var(--S2)}
.pc .tf button{height:3.2rem;border-radius:.9rem;font-family:var(--ui);font-weight:500;font-size:1.4rem;color:var(--t2);text-align:center}
.pc .tf button.on{background:#48484D;color:#fff}
.pc .hd .dlt{font-size:1.4rem}
.pclab span{transform:none!important;right:0;left:auto!important}
.pclab .mx{top:-.2rem}.pclab .mn{bottom:-.2rem}
.pc .hd{min-height:2.6rem}

/* ═══════ alive ═══════ */
/* the network behind the top */
.bgfx{position:absolute;left:0;right:0;top:0;height:52rem;z-index:0;pointer-events:none;width:100%;-webkit-mask-image:linear-gradient(to bottom,#000 55%,transparent 100%);mask-image:linear-gradient(to bottom,#000 55%,transparent 100%);will-change:transform,opacity}
.scr[data-id="hub"] .body{position:relative;z-index:1}
.scr[data-id="hub"] .sbtop{background:transparent!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;transition:background .25s,box-shadow .25s}
.scr[data-id="hub"].scrolled .sbtop{background:rgba(0,0,0,.66)!important;backdrop-filter:blur(24px) saturate(1.6)!important;-webkit-backdrop-filter:blur(24px) saturate(1.6)!important;box-shadow:0 .5px 0 rgba(255,255,255,.1)}
.sq,.srch{background:rgba(255,255,255,.08)!important;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1)}
.srch{color:rgba(255,255,255,.55)}
.srch .li{color:rgba(255,255,255,.7)}

/* the card on the full width; the next one waits behind the dots */
.car{gap:1.2rem}
.car>.cardp,.car>.gc{width:100%!important}
.cardp{box-shadow:inset 0 0 0 .5px rgba(255,255,255,.14),0 2.4rem 4.8rem -1.2rem rgba(0,0,0,.8),0 .8rem 2.4rem -1rem rgba(33,160,56,.35)}
.gc{background:linear-gradient(150deg,#16161A,#0C0C0E)!important;box-shadow:inset 0 0 0 .5px rgba(255,255,255,.1)!important}
.gc::before{opacity:.35;filter:blur(4rem)}

    }
    if (t.hasAttribute('data-sendok')) {
      if (t.dataset.busy) return; t.dataset.busy = 1; t.innerHTML = `${ic('scan-face')}Face ID…`; setTimeout(() => { closeSheet(); mount('tx'); }, 900); return;
    }
    if (t.hasAttribute('data-requote')) { return openSheet('confirm'); }
    if (false) {
      const c = COINS[st.coin], q = st.amount / c.rate;
      st.used += st.amount;
      st.holding = st.holding && st.holding.k === st.coin ? { k: st.coin, q: st.holding.q + q, rub: st.holding.rub + st.amount, last: st.amount } : { k: st.coin, q, rub: st.amount, last: st.amount };
      logOp({ k: st.coin, title: `Покупка ${c.sym}`, amt: `+${num(q, c.dp)} ${c.sym}`, sub: `−${rub(st.amount)}` });
      st.amount = Math.min(10000, LIMIT - st.used);
      return replaceTop('done');
    }
  });
  const doBuy = () => {
    const c = COINS[st.coin], fee = st.amount * FEE, q = (st.amount - fee) / c.rate;
    st.used += st.amount;
    st.holding = st.holding && st.holding.k === st.coin ? { k: st.coin, q: st.holding.q + q, rub: st.holding.rub + st.amount, last: st.amount, fee } : { k: st.coin, q, rub: st.amount, last: st.amount, fee };
    logOp({ k: st.coin, title: `Покупка ${c.sym}`, amt: `+${num(q, c.dp)} ${c.sym}`, sub: `−${rub(st.amount)}` });
    st.amount = Math.min(10000, LIMIT - st.used);
    replaceTop('done');
  };
  /* a 30-second quote: the timer counts down wherever a [data-qt] is on screen */
  let quoteEnd = 0;
  setInterval(() => {
    const left = Math.max(0, Math.ceil((quoteEnd - Date.now()) / 1000));
    document.querySelectorAll('[data-qt]').forEach(e => { e.textContent = left > 0 ? `${left} с` : 'обновите'; e.classList.toggle('late', left === 0); });
    const ok = sheet.querySelector('[data-buyok]');
    if (ok && left === 0 && !ok.dataset.busy) { ok.outerHTML = `<button class="btn" data-requote>${ic('refresh-cw')}Обновить курс</button>`; }
  }, 250);
  document.addEventListener('input', e => { if (e.target.id === 'rng') { st.amount = +e.target.value; updBuy(stack[stack.length - 1]); } });

  /* splash: characters fly in from everywhere and settle into the Sber mark, then the wallet opens */
  let SPLASHING = true;
  const splash = async () => {
    /* the same living mark as on onboarding: it breathes, ripples and scatters, the name rises under it */
    const el = document.getElementById('splash'), cv = el.querySelector('.spm');
    el.classList.remove('out'); el.classList.add('on');
    try { await Promise.race([document.fonts.load('400 40px "SB Sans Text Mono"').then(() => document.fonts.load('700 40px "SB Sans Text Mono"')), new Promise(r => setTimeout(r, 1200))]); } catch (_) {}
    const stop = MarkField(cv, { cy: .43, size: .6, seed: 'splash', host: el, dust: 140 });
    el.classList.add('go');
    let done = false;
    const finish = () => { if (done) return; done = true; el.classList.add('out'); setTimeout(() => { el.classList.remove('on', 'out', 'go'); stop && stop(); SPLASHING = false; const hub = stack[0]; hub && hub.querySelectorAll('.tsum span, .camt b').forEach(e => decode(e)); hub && hubChart(hub, true); }, 650); };
    el.onclick = finish; setTimeout(finish, 2900);
  };
  window.__splash = () => { SPLASHING = true; splash(); };

  mount('hub');
  splash();
  window.__go = id => mount(id);
})();
</script>
</body>
</html>
