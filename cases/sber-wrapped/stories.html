<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<!-- SB Sans from Sber's own CDN, the way the Plasma design system connects it -->
<link rel="preconnect" href="https://cdn-app.sberdevices.ru" crossorigin>
<link rel="stylesheet" href="https://cdn-app.sberdevices.ru/shared-static/0.0.0/styles/SBSansText.0.2.0.css">
<link rel="stylesheet" href="https://cdn-app.sberdevices.ru/shared-static/0.0.0/styles/SBSansDisplay.0.2.0.css">
<link rel="stylesheet" href="https://cdn-app.sberdevices.ru/shared-static/0.0.0/styles/SBSansTextMono.0.2.0.css">
<title>Итоги года — прототип сторис</title>
<meta name="description" content="Моушн-прототип концепта «Итоги года, которые продолжаются». Концепт, не связан со СберБанком.">
<style>
/* one grid for every story, sized in parts of the frame width (cqw): the same margins, the same rhythm */
:root{--g:#21A038;--gl:#3DD26C;--ink:#0B0B10;--ui:"SB Sans Display","SBSansDisplay","SB Sans Text","SBSansText",-apple-system,BlinkMacSystemFont,"SF Pro Display","Roboto","Helvetica Neue",Arial,sans-serif;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#07070B;color:#fff;font-family:var(--ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.stage{height:100svh;display:grid;place-items:center;padding:16px;background:radial-gradient(60% 50% at 50% 40%,#1A1530 0%,#07070B 70%)}
.st{--px:5.6cqw;container-type:size;position:relative;height:min(860px,calc(100svh - 32px));aspect-ratio:9/16;border-radius:28px;overflow:hidden;isolation:isolate;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 40px 120px rgba(0,0,0,.6);user-select:none;-webkit-user-select:none;touch-action:manipulation}
@media (max-width:560px){.stage{padding:0}.st{height:100svh;width:100vw;aspect-ratio:auto;border-radius:0}}

/* wallpaper */
.bg{position:absolute;inset:0;z-index:-3;transition:background 1s ease}
.orb{position:absolute;z-index:-2;width:80cqw;aspect-ratio:1;border-radius:50%;filter:blur(14cqw);opacity:.75;transition:transform 1.6s var(--ease),background 1s}
.o1{left:-30cqw;top:-20cqw}.o2{right:-35cqw;bottom:-10cqw}
.grain{position:absolute;inset:0;z-index:-1;opacity:.16;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* chrome: progress and header share the side margin */
.bars{position:absolute;left:var(--px);right:var(--px);top:3cqw;z-index:5;display:flex;gap:1cqw}
.bars i{flex:1;height:.7cqw;min-height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.bars i b{display:block;height:100%;width:0;background:#fff}
.hdr{position:absolute;left:var(--px);right:var(--px);top:6.4cqw;z-index:5;display:flex;align-items:center;gap:2cqw;font-size:3.3cqw;font-weight:600;color:rgba(255,255,255,.9)}
.hdr .mark{width:6cqw;height:6.3cqw;flex:none}
.hdr b{font-weight:700;font-size:3.9cqw;letter-spacing:.01em}
.hdr .sep{width:1px;height:3.6cqw;background:rgba(255,255,255,.35)}
.card .brand{display:flex;align-items:center;gap:1.6cqw;font-size:3.4cqw;font-weight:600;letter-spacing:-.01em;color:rgba(255,255,255,.85)}
.card .brand .mark{width:4.4cqw;height:4.6cqw}
.tap{position:absolute;inset:0;z-index:2;display:grid;grid-template-columns:1fr 2fr}
.note{position:absolute;left:0;right:0;bottom:2.4cqw;z-index:6;text-align:center;font-size:2.4cqw;color:rgba(255,255,255,.42);pointer-events:none}

/* the story */
.s{position:absolute;inset:0;z-index:3;padding:18cqw var(--px) 9cqw;pointer-events:none}
.s button{pointer-events:auto}
.in{height:100%;display:flex;flex-direction:column}

.hero{margin-top:0;font-weight:800;line-height:.9;letter-spacing:-.05em;white-space:nowrap;font-variant-numeric:tabular-nums}
.h-num{font-size:26cqw}.h-sum{font-size:17cqw}.h-word{font-size:14cqw}
.t{margin-top:3.4cqw;font-weight:650;font-size:6cqw;line-height:1.18;letter-spacing:-.02em}
.sub{margin-top:1.6cqw;font-size:4.2cqw;line-height:1.4;color:rgba(255,255,255,.76)}
.vis{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqw;padding:5cqw 0}
.bot{display:grid;gap:2cqw}

/* the soft next step */
.act{display:flex;align-items:center;gap:3cqw;width:100%;min-height:15cqw;padding:3cqw 3.6cqw 3cqw 4cqw;border-radius:4.6cqw;background:rgba(255,255,255,.13);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);text-align:left;transition:background .3s,box-shadow .3s,transform .2s}
.act:active{transform:scale(.985)}
.act span{flex:1;display:grid;gap:.6cqw;font-weight:650;font-size:4cqw;line-height:1.2}
.act small{font-weight:400;font-size:3.2cqw;color:rgba(255,255,255,.7)}
.act i{flex:none;display:grid;place-items:center;width:8cqw;height:8cqw;border-radius:50%;background:var(--gl);color:#05210E;font-style:normal;font-weight:800;font-size:4.4cqw;line-height:1;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.act.on{background:rgba(61,210,108,.2);box-shadow:inset 0 0 0 1.5px var(--gl)}
.act.on i{transform:rotate(360deg)}

/* entrance */
.in>*{opacity:0;transform:translateY(4cqw)}
.go .in>*{animation:up .7s var(--ease) forwards}
.go .in>*:nth-child(2){animation-delay:.1s}.go .in>*:nth-child(3){animation-delay:.2s}.go .in>*:nth-child(4){animation-delay:.3s}.go .in>*:nth-child(5){animation-delay:.4s}.go .in>*:nth-child(6){animation-delay:.5s}
@keyframes up{to{opacity:1;transform:none}}

/* 1 · the year and the tone */
.yr{font-weight:700;font-size:34cqw;line-height:.86;letter-spacing:-.06em;color:#fff;clip-path:inset(100% 0 0 0)}
.go .yr{animation:rise 1.1s .35s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes rise{to{clip-path:inset(-10% 0 -10% 0)}}
.tone{display:grid;grid-template-columns:1fr 1fr;gap:2cqw}
.tone button{height:13cqw;border-radius:4cqw;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);font-weight:650;font-size:4cqw}
.tone button.on{background:#fff;color:var(--ink)}
.ask{font-size:3.6cqw;color:rgba(255,255,255,.7);margin-bottom:.4cqw}

/* 2 · the city on a field of dots */
.map{position:relative;width:100%;aspect-ratio:1.25}
.map>i{position:absolute;width:1.6cqw;height:1.6cqw;margin:-.8cqw;border-radius:50%;background:#fff}
.map>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.map>svg path{fill:none;stroke:#fff;stroke-width:.55cqw;stroke-linecap:round;stroke-dasharray:1.4cqw 1.6cqw;opacity:.85}
.map .pin{position:absolute;width:4.4cqw;height:4.4cqw;margin:-2.2cqw;border-radius:50%;background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.6);animation:ping 2s 1.2s infinite}
.map .home{position:absolute;width:2.8cqw;height:2.8cqw;margin:-1.4cqw;border-radius:50%;box-shadow:inset 0 0 0 .5cqw #fff}
.map .lab{position:absolute;font-size:3.2cqw;font-weight:650;white-space:nowrap}
@keyframes ping{70%{box-shadow:0 0 0 6cqw rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}

/* 3 · one thing equals another */
.eq{display:flex;align-items:center;justify-content:center;gap:4cqw}
.ic{display:grid;place-items:center;width:24cqw;height:24cqw;border-radius:7cqw;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.ic svg{width:12cqw;height:12cqw;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.eqs{font-weight:300;font-size:10cqw;color:rgba(255,255,255,.8)}
.pill{padding:2.6cqw 4.4cqw;border-radius:999px;background:#fff;color:var(--ink);font-weight:700;font-size:3.8cqw;white-space:nowrap;transform:rotate(-2deg)}

/* 4 · one dot per visit */
.dots{display:grid;grid-template-columns:repeat(16,1fr);gap:1.5cqw;width:100%}
.dots i{aspect-ratio:1;border-radius:50%;background:#fff;opacity:0;transform:scale(.2)}
.go .dots i{animation:pop .4s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes pop{to{opacity:.9;transform:none}}

/* 5 · the people */
.ppl{display:flex;align-items:center;justify-content:center}
.ppl span{position:relative;display:grid;place-items:center;width:21cqw;height:21cqw;margin-left:-5cqw;border-radius:50%;box-shadow:0 0 0 1.4cqw #12306F;font-weight:800;font-size:7cqw}
.ppl span:first-child{margin-left:0;box-shadow:0 0 0 1.4cqw #fff}
.ppl span:nth-child(1){z-index:4}.ppl span:nth-child(2){z-index:3}.ppl span:nth-child(3){z-index:2}.ppl span:nth-child(4){z-index:1}
.ppl-cap{font-size:3.4cqw;color:rgba(255,255,255,.7)}

/* 6 · months */
.mo{width:100%;display:grid;grid-template-columns:repeat(12,1fr);gap:1.6cqw;align-items:end;height:42cqw}
.mo i{height:0;border-radius:1.6cqw 1.6cqw .8cqw .8cqw;background:rgba(255,255,255,.3);transition:height 1s var(--ease)}
.mo i.hi{background:#fff}
.mol{width:100%;display:grid;grid-template-columns:repeat(12,1fr);gap:1.6cqw;text-align:center;font-size:2.6cqw;font-weight:600;color:rgba(255,255,255,.6)}
.mol .hi{color:#fff}

/* 7 · weeks of calm */
.wk{width:100%;display:grid;grid-template-columns:repeat(7,1fr);gap:2cqw}
.wk i{aspect-ratio:1;border-radius:2.6cqw;background:rgba(255,255,255,.16);opacity:0;transform:scale(.4)}
.wk i.f{background:#fff}
.go .wk i{animation:pop2 .5s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes pop2{to{opacity:1;transform:none}}
.wk-cap{align-self:flex-start;font-size:3.4cqw;color:rgba(255,255,255,.7)}

/* 8 · type of the year */
.ill{width:74cqw;max-width:100%}
.ill svg{display:block;width:100%;height:auto;overflow:visible}
.spin{transform-origin:120px 100px;animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.badge{justify-self:start;padding:2cqw 3.4cqw;border-radius:999px;background:rgba(255,255,255,.15);font-weight:600;font-size:3.4cqw}

/* 9 · the shareable card and the plan */
.card{width:100%;padding:5cqw;border-radius:6cqw;background:linear-gradient(160deg,rgba(255,255,255,.24),rgba(255,255,255,.06));box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.card .ct{margin-top:1.4cqw;font-weight:800;font-size:9cqw;letter-spacing:-.04em;line-height:1}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:2.6cqw;margin-top:4cqw}
.cg div{padding:3cqw;border-radius:3.6cqw;background:rgba(0,0,0,.2)}
.cg b{display:block;font-weight:800;font-size:5.6cqw;letter-spacing:-.03em;line-height:1.05;white-space:nowrap}
.cg small{display:block;margin-top:.8cqw;font-size:2.9cqw;color:rgba(255,255,255,.7)}
.card-cap{font-size:3cqw;color:rgba(255,255,255,.62);text-align:center}
.ph{font-weight:650;font-size:5cqw;letter-spacing:-.02em}
.plan{display:grid;gap:1.6cqw;list-style:none}
.plan li{display:flex;align-items:center;gap:2.4cqw;font-size:3.8cqw}
.plan li::before{content:"✓";display:grid;place-items:center;flex:none;width:5.4cqw;height:5.4cqw;border-radius:50%;background:var(--gl);color:#05210E;font-weight:800;font-size:3cqw}
.plan .empty{color:rgba(255,255,255,.6)}
.plan .empty::before{content:"+";background:rgba(255,255,255,.2);color:#fff}
.fin{display:grid;grid-template-columns:1fr 1fr;gap:2cqw;margin-top:1cqw}
.fin button{height:13cqw;border-radius:4cqw;background:#fff;color:var(--ink);font-weight:700;font-size:4cqw}
.fin button.g{background:#fff;color:#0B6B26}
.fin button:not(.g){background:rgba(255,255,255,.16);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}

.toast{position:absolute;left:50%;top:16cqw;z-index:9;translate:-50% -2cqw;padding:2.4cqw 4cqw;border-radius:3.4cqw;background:#fff;color:var(--ink);font-weight:650;font-size:3.4cqw;opacity:0;transition:opacity .3s,translate .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;translate:-50% 0}
@media (prefers-reduced-motion:reduce){*,*::before{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}

/* Lucide icons */
.li{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act .lead{flex:none;display:grid;place-items:center;width:10cqw;height:10cqw;border-radius:3cqw;background:rgba(255,255,255,.14)}
.act .lead .li{width:5cqw;height:5cqw}
.act i .li{width:4.4cqw;height:4.4cqw;stroke-width:2.4}
.ic .li{width:11cqw;height:11cqw;stroke-width:1.6}
.map .home{display:grid;place-items:center;width:8cqw;height:8cqw;margin:-4cqw;border-radius:50%;background:rgba(255,255,255,.16);box-shadow:none;color:#fff}
.map .home .li{width:4.4cqw;height:4.4cqw}
.map .pin{display:grid;place-items:center;width:9cqw;height:9cqw;margin:-4.5cqw;color:#06232A}
.map .pin .li{width:5cqw;height:5cqw;stroke-width:2.2}
.plan li::before{content:none}
.plan li b{flex:none;display:grid;place-items:center;width:5.4cqw;height:5.4cqw;border-radius:50%;background:var(--gl);color:#05210E}
.plan li b .li{width:3.4cqw;height:3.4cqw;stroke-width:3}
.plan .empty b{background:rgba(255,255,255,.2);color:#fff}
.fin button{display:flex;align-items:center;justify-content:center;gap:2cqw}
.fin button .li{width:4.6cqw;height:4.6cqw}
.give{display:flex;align-items:center;gap:1.6cqw}
.give .li{flex:none;width:4.4cqw;height:4.4cqw;color:#FF6FB5;fill:#FF6FB5}
</style>
</head>
<body>
<div class="stage">
  <div class="st" id="st">
    <div class="bg" id="bg"></div><i class="orb o1" id="o1"></i><i class="orb o2" id="o2"></i><div class="grain"></div>
    <div class="bars" id="bars"></div>
    <div class="hdr"><svg class="mark" viewBox="0 0 19.07 20" aria-label="Сбер"><path fill="#fff" fill-rule="evenodd" clip-rule="evenodd" d="M19.065 9.98859C19.065 9.40309 19.012 8.82959 18.912 8.27309L16.86 9.79209C16.8615 9.85709 16.8625 9.92309 16.8625 9.98859C16.8625 14.0486 13.574 17.3521 9.5325 17.3521C5.49051 17.3521 2.202 14.0491 2.202 9.98859C2.202 5.92859 5.49051 2.62509 9.53201 2.62509C11.064 2.62509 12.4875 3.10009 13.665 3.91009L15.519 2.53759C13.8825 1.20909 11.8 0.413086 9.5325 0.413086C4.26749 0.413086 0 4.70009 0 9.98859C0 15.2771 4.26801 19.5641 9.5325 19.5641C14.797 19.5641 19.0645 15.2771 19.0645 9.98909L19.065 9.98859ZM5.90677 7.43339L9.54678 9.71839L17.1128 4.13389C17.5643 4.71889 17.9503 5.35689 18.2588 6.03739L9.54678 12.4674L5.90677 10.1824V7.43339Z"/></svg><b>Сбер</b><span class="sep"></span>Итоги 2026</div>
    <div class="tap"><button aria-label="Назад" id="prev"></button><button aria-label="Дальше" id="next"></button></div>
    <div id="slot"></div>
    <div class="toast" id="toast" role="status"></div>
    <div class="note">Концепт дизайнера · не связан со СберБанком · цифры условные</div>
  </div>
</div>
<script>
(() => {
  /* the person in the prototype — illustrative figures */
  const P = { city: 'Казань', trips: 4, coffee: 18400, place: 'Кофейню у дома', visits: 112, transfers: 87, saved: 64000, weeks: 7 };
  const MONTHS = ['Я', 'Ф', 'М', 'А', 'М', 'И', 'И', 'А', 'С', 'О', 'Н', 'Д'];
  const MV = [42, 55, 100, 48, 60, 72, 66, 80, 51, 45, 58, 88], HI = 2;
  /* two tones; the humorous one jokes with you, never at you */
  const T = {
    kind: { open: 'Посмотрим, каким он был', city: '4 поездки — чаще, чем куда-либо ещё', coffee: 'столько ушло на кофе за год', coffee2: 'почти билет в Стамбул', place: 'Вы их постоянный гость', give: 'Мама — на первом месте', month: 'Концерты, поездки и больше всего встреч', save: 'Это 7 недель спокойной жизни', type: 'Вы открывали новые места чаще, чем 92% клиентов' },
    fun: { open: 'Спойлер: было весело', city: '4 поездки. Казань уже считает вас своим', coffee: 'ушло на кофе. Сна не было, зато было вкусно', coffee2: 'хватило бы на Стамбул', place: 'Бариста точно знает ваше имя', give: 'Мама, мы знаем, ты читаешь', month: 'Март вы прожили на максималках', save: 'Подушка готова — можно выдохнуть', type: 'Чемодан распакован реже, чем у 92% клиентов' }
  };
  let tone = 'kind';
  const plan = new Set();
  const PLAN = { trip: 'Цель на следующую поездку', istanbul: 'Копить на Стамбул', cashback: 'Кешбэк 10% в кофейнях', thanks: 'Открытка маме', goal: 'Цель на 2027' };
  const MARK_SM = `<svg class="mark" viewBox="0 0 19.07 20" aria-label="Сбер"><path fill="#fff" fill-rule="evenodd" clip-rule="evenodd" d="M19.065 9.98859C19.065 9.40309 19.012 8.82959 18.912 8.27309L16.86 9.79209C16.8615 9.85709 16.8625 9.92309 16.8625 9.98859C16.8625 14.0486 13.574 17.3521 9.5325 17.3521C5.49051 17.3521 2.202 14.0491 2.202 9.98859C2.202 5.92859 5.49051 2.62509 9.53201 2.62509C11.064 2.62509 12.4875 3.10009 13.665 3.91009L15.519 2.53759C13.8825 1.20909 11.8 0.413086 9.5325 0.413086C4.26749 0.413086 0 4.70009 0 9.98859C0 15.2771 4.26801 19.5641 9.5325 19.5641C14.797 19.5641 19.0645 15.2771 19.0645 9.98909L19.065 9.98859ZM5.90677 7.43339L9.54678 9.71839L17.1128 4.13389C17.5643 4.71889 17.9503 5.35689 18.2588 6.03739L9.54678 12.4674L5.90677 10.1824V7.43339Z"/></svg>`;
  const rub = n => Math.round(n).toLocaleString('ru-RU') + ' ₽';

  /* wallpapers from the Nova backgrounds: violet, blue, teal, magenta, green, night */
  const W = {
    brand: ['linear-gradient(160deg,#0B6B26 0%,#21A038 48%,#4FDA69 100%)', '#61F57C', '#32B8D3'],
    logo: ['linear-gradient(160deg,#0E7A35 0%,#22A05A 40%,#2D9FC4 100%)', '#64EE61', '#32B8D3'],
    night: ['linear-gradient(170deg,#191335 0%,#0B0B1A 55%,#0A1A18 100%)', '#6A57F0', '#17A27C'],
    teal: ['linear-gradient(170deg,#0C3B40 0%,#06232A 60%,#041619 100%)', '#18CDAE', '#0B6170'],
    magenta: ['linear-gradient(170deg,#4A0F36 0%,#2A0920 60%,#180514 100%)', '#FF4FA3', '#8E1563'],
    violet: ['linear-gradient(170deg,#2B1A5C 0%,#1B1238 60%,#100B24 100%)', '#8060FF', '#3A1E9C'],
    blue: ['linear-gradient(170deg,#12306F 0%,#0C1838 60%,#081026 100%)', '#3E8BFF', '#1A3FB8'],
    green: ['linear-gradient(170deg,#0D3D21 0%,#06200F 60%,#04140A 100%)', '#2BD36B', '#0E6B38']
  };
  /* icons: Lucide v0.454.0 (ISC licence, lucide.dev), one 2px stroke on a 24px grid */
  const LUCIDE = {"bookmark-check": "<path d=\"m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2Z\"/> <path d=\"m9 10 2 2 4-4\"/>", "calendar-heart": "<path d=\"M3 10h18V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7\"/> <path d=\"M8 2v4\"/> <path d=\"M16 2v4\"/> <path d=\"M21.29 14.7a2.43 2.43 0 0 0-2.65-.52c-.3.12-.57.3-.8.53l-.34.34-.35-.34a2.43 2.43 0 0 0-2.65-.53c-.3.12-.56.3-.79.53-.95.94-1 2.53.2 3.74L17.5 22l3.6-3.55c1.2-1.21 1.14-2.8.19-3.74Z\"/>", "check": "<path d=\"M20 6 9 17l-5-5\"/>", "coffee": "<path d=\"M10 2v2\"/> <path d=\"M14 2v2\"/> <path d=\"M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1\"/> <path d=\"M6 2v2\"/>", "gift": "<rect x=\"3\" y=\"8\" width=\"18\" height=\"4\" rx=\"1\"/> <path d=\"M12 8v13\"/> <path d=\"M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7\"/> <path d=\"M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5\"/>", "heart": "<path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/>", "house": "<path d=\"M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8\"/> <path d=\"M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\"/>", "map-pin": "<path d=\"M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0\"/> <circle cx=\"12\" cy=\"10\" r=\"3\"/>", "percent": "<line x1=\"19\" x2=\"5\" y1=\"5\" y2=\"19\"/> <circle cx=\"6.5\" cy=\"6.5\" r=\"2.5\"/> <circle cx=\"17.5\" cy=\"17.5\" r=\"2.5\"/>", "piggy-bank": "<path d=\"M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.7-1 2-2h2v-4h-2c0-1-.5-1.5-1-2V5z\"/> <path d=\"M2 9v1c0 1.1.9 2 2 2h1\"/> <path d=\"M16 11h.01\"/>", "plane": "<path d=\"M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z\"/>", "plus": "<path d=\"M5 12h14\"/> <path d=\"M12 5v14\"/>", "share-2": "<circle cx=\"18\" cy=\"5\" r=\"3\"/> <circle cx=\"6\" cy=\"12\" r=\"3\"/> <circle cx=\"18\" cy=\"19\" r=\"3\"/> <line x1=\"8.59\" x2=\"15.42\" y1=\"13.51\" y2=\"17.49\"/> <line x1=\"15.41\" x2=\"8.59\" y1=\"6.51\" y2=\"10.49\"/>", "sparkles": "<path d=\"M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z\"/> <path d=\"M20 3v4\"/> <path d=\"M22 5h-4\"/> <path d=\"M4 17v2\"/> <path d=\"M5 18H3\"/>"};
  const ic = (n, c = '') => `<svg class="li ${c}" viewBox="0 0 24 24" aria-hidden="true">${LUCIDE[n]}</svg>`;
  const ACT_IC = { trip: 'map-pin', istanbul: 'plane', cashback: 'percent', thanks: 'gift', goal: 'piggy-bank' };
  const act = (id, title, sub) => `<button class="act${plan.has(id) ? ' on' : ''}" data-plan="${id}"><b class="lead">${ic(ACT_IC[id])}</b><span>${title}<small>${sub}</small></span><i>${ic(plan.has(id) ? 'check' : 'plus')}</i></button>`;
  const ILL = `<svg viewBox="0 0 240 200" aria-hidden="true"><g class="spin"><ellipse cx="120" cy="100" rx="100" ry="40" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.6" stroke-dasharray="3 6"/><path d="M220 100l-14-7 3 7-3 7Z" fill="#fff"/></g><circle cx="120" cy="100" r="48" fill="#fff"/><path d="M92 92c10-6 20 4 30-2s18 2 26-2M88 110c12 4 22-4 34 0s20-2 30 2" stroke="#0B6170" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="164" cy="56" r="9" fill="#18CDAE"/><circle cx="70" cy="150" r="5" fill="#fff" opacity=".6"/></svg>`;

  /* each story is the same frame: kicker · hero · line · visual in the middle · action at the bottom */
  const S = [
    { w: 'brand', hold: true, h: () => `
      <div class="vis"><span class="yr">2026</span></div>
      <p class="t" style="text-align:center;margin-top:0">${T[tone].open}</p>
      <div class="bot" style="margin-top:6cqw"><p class="ask">Как рассказать?</p><div class="tone"><button data-tone="kind" class="${tone === 'kind' ? 'on' : ''}">По-доброму</button><button data-tone="fun" class="${tone === 'fun' ? 'on' : ''}">С юмором</button></div></div>` },
    { w: 'teal', h: () => `
      <p class="hero h-word">${P.city}</p>
      <p class="t">Ваш город года</p><p class="sub">${T[tone].city}</p>
      <div class="vis"><div class="map" id="map"></div></div>
      <div class="bot">${act('trip', 'Цель на поездку', 'Посчитаем, сколько откладывать')}</div>` },
    { w: 'magenta', h: () => `
      <p class="hero h-sum" data-count="${P.coffee}" data-rub>0 ₽</p>
      <p class="t">${T[tone].coffee}</p>
      <div class="vis"><div class="eq"><span class="ic">${ic('coffee')}</span><span class="eqs">=</span><span class="ic">${ic('plane')}</span></div><span class="pill">${T[tone].coffee2}</span></div>
      <div class="bot">${act('istanbul', 'Копить на Стамбул', 'Цель 20 000 ₽ · к весне')}</div>` },
    { w: 'violet', h: () => `
      <p class="hero h-num" data-count="${P.visits}">0</p>
      <p class="t">визитов в «${P.place}»</p><p class="sub">${T[tone].place}</p>
      <div class="vis"><div class="dots">${Array.from({ length: P.visits }, (_, i) => `<i style="animation-delay:${(.5 + i * .011).toFixed(3)}s"></i>`).join('')}</div></div>
      <div class="bot">${act('cashback', 'Кешбэк 10% в кофейнях', 'Включить на 2027')}</div>` },
    { w: 'blue', h: () => `
      <p class="hero h-num" data-count="${P.transfers}">0</p>
      <p class="t">переводов близким</p><p class="sub give">${ic('heart')}${T[tone].give}</p>
      <div class="vis"><div class="ppl"><span style="background:#FF6FB5">М</span><span style="background:#4D96FF">А</span><span style="background:#22C9A6">Д</span><span style="background:#8A6CFF">О</span></div><p class="ppl-cap">Мама · Андрей · Даша · Оля</p></div>
      <div class="bot">${act('thanks', 'Отправить маме открытку', 'Спасибо за год')}</div>` },
    { w: 'night', h: () => `
      <p class="hero h-word">Март</p>
      <p class="t">Самый яркий месяц года</p><p class="sub">${T[tone].month}</p>
      <div class="vis"><div class="mo" id="mo">${MV.map((v, i) => `<i data-h="${v}" class="${i === HI ? 'hi' : ''}"></i>`).join('')}</div><div class="mol">${MONTHS.map((m, i) => `<span class="${i === HI ? 'hi' : ''}">${m}</span>`).join('')}</div></div>` },
    { w: 'green', h: () => `
      <p class="hero h-sum" data-count="${P.saved}" data-rub>0 ₽</p>
      <p class="t">отложено за год</p><p class="sub">${T[tone].save}</p>
      <div class="vis"><div class="wk">${Array.from({ length: 14 }, (_, i) => `<i class="${i < P.weeks ? 'f' : ''}" style="animation-delay:${(.5 + i * .06).toFixed(2)}s"></i>`).join('')}</div><p class="wk-cap">Каждая клетка — неделя расходов</p></div>
      <div class="bot">${act('goal', 'Поставить цель на 2027', 'Ещё 7 недель спокойствия')}</div>` },
    { w: 'teal', h: () => `
      <div class="vis"><div class="ill">${ILL}</div></div>
      <p class="hero h-word" style="font-size:10.6cqw">Путешественник</p>
      <p class="sub">${T[tone].type}</p>
      <div class="bot" style="margin-top:4cqw"><span class="badge">Один из шести типов года</span></div>` },
    { w: 'logo', hold: true, h: () => `
      <div class="vis"><div class="card"><p class="brand">${MARK_SM}Итоги 2026</p><p class="ct">Путешественник</p><div class="cg"><div><b>${P.city}</b><small>город года</small></div><div><b>Март</b><small>месяц года</small></div><div><b>${P.transfers}</b><small>переводов близким</small></div><div><b>Топ-8%</b><small>по поездкам</small></div></div></div><p class="card-cap">В карточке для соцсетей нет сумм — только ваш год</p></div>
      <div class="bot"><p class="ph">Ваш план на 2027</p><ul class="plan" id="plan"></ul><div class="fin"><button id="share">${ic('share-2')}Поделиться</button><button class="g" id="save">${ic('bookmark-check')}Сохранить план</button></div></div>` }
  ];

  const st = document.getElementById('st'), slot = document.getElementById('slot'), bars = document.getElementById('bars'), bg = document.getElementById('bg'), o1 = document.getElementById('o1'), o2 = document.getElementById('o2'), toast = document.getElementById('toast');
  const DUR = 6000;
  bars.innerHTML = S.map(() => '<i><b></b></i>').join('');
  let cur = 0, el = 0, last = 0, paused = false;

  function show(i) {
    cur = Math.max(0, Math.min(S.length - 1, i));
    const s = S[cur], w = W[s.w];
    bg.style.background = w[0]; o1.style.background = w[1]; o2.style.background = w[2];
    o1.style.transform = `translate(${[0, 10, -6, 14, 4, -8, 8, 0, 12][cur]}cqw,${[0, 8, 14, -4, 10, 6, -6, 12, 4][cur]}cqw)`;
    o2.style.transform = `translate(${[0, -12, 6, -4, -14, 8, -6, 10, -10][cur]}cqw,${[0, -10, -4, 8, -6, -12, 4, -8, -2][cur]}cqw)`;
    slot.innerHTML = `<section class="s"><div class="in">${s.h()}</div></section>`;
    [...bars.children].forEach((b, k) => { b.firstElementChild.style.width = k < cur ? '100%' : k === cur && s.hold ? '100%' : '0'; });
    requestAnimationFrame(() => slot.firstElementChild.classList.add('go'));
    wire(); count(); extras();
    el = 0;
  }
  function wire() {
    slot.querySelectorAll('[data-tone]').forEach(b => b.onclick = () => { tone = b.dataset.tone; slot.querySelectorAll('[data-tone]').forEach(x => x.classList.toggle('on', x === b)); setTimeout(() => go(1), 350); });
    slot.querySelectorAll('[data-plan]').forEach(b => b.onclick = () => {
      const id = b.dataset.plan; plan.has(id) ? plan.delete(id) : plan.add(id);
      b.classList.toggle('on', plan.has(id)); b.querySelector('i').innerHTML = ic(plan.has(id) ? 'check' : 'plus');
      say(plan.has(id) ? 'Добавлено в план на 2027' : 'Убрано из плана');
    });
    const pl = slot.querySelector('#plan');
    if (pl) pl.innerHTML = plan.size ? [...plan].map(id => `<li><b>${ic('check')}</b>${PLAN[id]}</li>`).join('') : `<li class="empty"><b>${ic('plus')}</b>Добавляйте шаги в прошлых сторис</li>`;
    const sh = slot.querySelector('#share'); if (sh) sh.onclick = () => say('Карточка готова — без сумм');
    const sv = slot.querySelector('#save'); if (sv) sv.onclick = () => say(plan.size ? `В плане на 2027: ${plan.size} ${plan.size === 1 ? 'шаг' : plan.size < 5 ? 'шага' : 'шагов'}` : 'Добавьте хотя бы один шаг');
  }
  function count() {
    slot.querySelectorAll('[data-count]').forEach(n => {
      const to = +n.dataset.count, r = n.hasAttribute('data-rub'), s0 = performance.now() + 150, d = 1300;
      (function tick(t) { const p = Math.max(0, Math.min(1, (t - s0) / d)), e = 1 - Math.pow(1 - p, 3); n.textContent = r ? rub(to * e) : Math.round(to * e); if (p < 1) requestAnimationFrame(tick); })(performance.now());
    });
  }
  function extras() {
    const map = slot.querySelector('#map');
    if (map) {
      /* a regular field of dots that fades to the edges, a dashed route from home to the city of the year */
      let d = '';
      for (let r = 0; r < 9; r++) for (let c = 0; c < 11; c++) {
        const x = 5 + c * 9, y = 6 + r * 11, dist = Math.hypot(x - 50, y - 50) / 60;
        if ((r * 7 + c * 3) % 5 === 0) continue;
        d += `<i style="left:${x}%;top:${y}%;opacity:${Math.max(.08, .5 - dist * .45).toFixed(2)}"></i>`;
      }
      map.innerHTML = d + '<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M20 78 C 34 50, 58 72, 77 33" vector-effect="non-scaling-stroke"/></svg><span class="home" style="left:20%;top:78%">' + ic('house') + '</span><span class="pin" style="left:77%;top:33%">' + ic('map-pin') + '</span><span class="lab" style="left:20%;top:86%;translate:-50% 0">Дом</span><span class="lab" style="left:77%;top:19%;translate:-50% 0">' + P.city + '</span>';
    }
    const mo = slot.querySelector('#mo');
    if (mo) setTimeout(() => mo.querySelectorAll('i').forEach((b, k) => { b.style.transitionDelay = (k * .05) + 's'; b.style.height = b.dataset.h + '%'; }), 400);
  }
  function say(t) { toast.textContent = t; toast.classList.add('on'); clearTimeout(say.t); say.t = setTimeout(() => toast.classList.remove('on'), 1600); }
  const go = d => { const n = cur + d; if (n < 0 || n >= S.length) return; show(n); };

  /* the bar runs; a story with a choice waits for the viewer */
  function loop(t) {
    const dt = last ? t - last : 0; last = t;
    if (!paused && !S[cur].hold) { el += dt; const p = Math.min(1, el / DUR); bars.children[cur].firstElementChild.style.width = (p * 100) + '%'; if (p >= 1) go(1); }
    requestAnimationFrame(loop);
  }
  /* tap left — back, tap right — on, hold — pause */
  let down = 0;
  ['prev', 'next'].forEach(id => {
    const b = document.getElementById(id);
    b.addEventListener('pointerdown', () => { down = performance.now(); paused = true; });
    b.addEventListener('pointerup', () => { paused = false; if (performance.now() - down < 250) go(id === 'next' ? 1 : -1); });
    b.addEventListener('pointerleave', () => { paused = false; });
  });
  addEventListener('keydown', e => { if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(1); } if (e.key === 'ArrowLeft') go(-1); });
  window.__go = n => show(n);
  show(0); requestAnimationFrame(loop);
})();
</script>
