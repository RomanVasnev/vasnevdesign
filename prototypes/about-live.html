<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Живая типографика: шаги</title>
<style>
/* Prototype of the «Обо мне» block, desktop only: the seven stages of the process as seven living words — by vasnev.art */
@font-face{font-family:'Geist';font-weight:400;font-display:swap;src:url(../public/fonts/geist-400.woff2) format('woff2')}
@font-face{font-family:'Geist';font-weight:500;font-display:swap;src:url(../public/fonts/geist-500.woff2) format('woff2')}
@font-face{font-family:'Geist Mono';font-weight:400;font-display:swap;src:url(../public/fonts/geist-mono-400.woff2) format('woff2')}
:root{--accent:#2F5CFF;--a2:#8E5CFF;--a3:#FF6BD6;--sel:#0D99FF;--comp:#9747FF;--green:#34C759;--amber:#FF9F0A;--red:#FF3B30;--mono:'Geist Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:#F5F5F7;color:#1D1D1F;font-family:'Geist',-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--sel);outline-offset:3px}
.wrap{padding:16px clamp(8px,2vw,24px) 24px}
.fr-label{display:flex;align-items:center;gap:6px;height:24px;margin:0 0 6px;font:400 13px/1 var(--mono);color:#8E8E93}
.fr-label svg{width:12px;height:12px;fill:none;stroke:currentColor}
.track{position:relative}
.pin{position:sticky;top:0;height:100vh;padding:14px 0}
.frame{position:relative;height:100%;overflow:hidden;border-radius:28px;background:var(--bgc,#F5F5F7);transition:background .55s ease}
.stage{position:absolute;left:0;top:0;width:1360px;height:800px;transform-origin:0 0;color:var(--fgc,#1D1D1F);transition:color .45s ease}
.after{margin:0 clamp(8px,2vw,24px) 40px;padding:32px;border-radius:28px;background:#1D1D1F;color:#fff;font-size:24px;letter-spacing:-.03em}

/* interface around the words */
.ey{position:absolute;left:60px;top:48px;font:400 14px/1 var(--mono);opacity:.62;z-index:6}
.prog{position:absolute;right:60px;top:52px;display:flex;gap:5px;z-index:6}
.prog i{width:24px;height:3px;border-radius:2px;background:currentColor;opacity:.18;transition:opacity .25s}
.prog i.on{opacity:1}
.skip{position:absolute;right:60px;top:68px;font-size:14px;color:inherit;opacity:.55;text-underline-offset:3px;z-index:6}
.say{position:absolute;left:60px;bottom:48px;width:640px;margin:0;font-weight:400;font-size:21px;line-height:1.3;letter-spacing:-.012em;text-wrap:pretty;z-index:6}
.say em{font-style:normal;opacity:.5}

/* a scene */
.sc{position:absolute;inset:0;opacity:0;visibility:hidden}
.word{position:absolute;left:60px;right:60px;top:150px;height:400px;display:flex;align-items:center;font-weight:500;letter-spacing:-.06em;white-space:nowrap;line-height:1}
.line{position:relative;display:inline-flex;align-items:baseline}
.l{display:inline-block;will-change:transform;transform-origin:50% 100%;position:relative}

/* opening */
.big{position:absolute;left:60px;top:190px;width:1180px;margin:0;font-weight:500;font-size:104px;line-height:1;letter-spacing:-.052em}
.big em{font-style:normal;opacity:.3}

/* 1: Figma text box */
.gd{position:absolute;left:0;right:0;height:1px;background:#FF3D8B;transform-origin:0 50%;opacity:.8;z-index:1}
.gd span{position:absolute;right:60px;top:-20px;font:400 12px var(--mono);color:#FF3D8B;white-space:nowrap}
.fbox{position:absolute;box-shadow:0 0 0 1.5px var(--sel);pointer-events:none}
.fbox i{position:absolute;width:10px;height:10px;background:#fff;box-shadow:0 0 0 1.5px var(--sel)}
.fbox i:nth-child(1){left:-5px;top:-5px}.fbox i:nth-child(2){right:-5px;top:-5px}.fbox i:nth-child(3){left:-5px;bottom:-5px}.fbox i:nth-child(4){right:-5px;bottom:-5px}
.fbox span{position:absolute;left:50%;bottom:-32px;transform:translateX(-50%);padding:3px 8px;border-radius:5px;background:var(--sel);color:#fff;font-size:13px;letter-spacing:0;white-space:nowrap}
.caret{display:inline-block;width:7px;height:.8em;align-self:center;margin-left:8px;background:var(--sel);opacity:0}
.formula{position:absolute;left:60px;top:556px;font-size:29px;font-weight:500;letter-spacing:-.035em;white-space:nowrap}
.formula b{font-weight:500;padding:1px 9px;border-radius:9px;background:var(--accent);color:#fff;transition:background .25s}

/* 2 */
.lk{position:absolute;left:0;top:0;width:1360px;height:800px;overflow:visible;pointer-events:none}
.lk path{fill:none;stroke-width:4;stroke-linecap:round}
.chip{position:absolute;padding:6px 13px;border-radius:11px;background:#fff;color:#1D1D1F;font-size:17px;white-space:nowrap;letter-spacing:-.01em;opacity:0}
.chip.bad{background:var(--red);color:#fff}

/* 3 */
#cv{position:absolute;left:0;top:0;width:1360px;height:800px}

/* 4 */
.ol{-webkit-text-stroke:2px rgba(255,255,255,.75);color:transparent}
.fl{position:absolute;left:0;top:0;color:#fff}

/* 5 */
.l .cb{position:absolute;inset:6% -1%;box-shadow:0 0 0 1.5px var(--comp);opacity:0;pointer-events:none}
.l .cb::before{content:"";position:absolute;left:0;top:-14px;width:8px;height:8px;background:var(--comp);transform:rotate(45deg)}
#rog{position:absolute;font-family:Georgia,'Times New Roman',serif;font-weight:400;color:#FF3BB0;opacity:0;line-height:1}
#rogT{position:absolute;padding:6px 13px;border-radius:11px;background:var(--red);color:#fff;font-size:17px;white-space:nowrap;opacity:0}

/* 6 */
#gate{position:absolute;width:5px;background:var(--red);box-shadow:0 0 28px var(--red);opacity:0}
.pinn{position:absolute;display:flex;align-items:center;gap:10px;padding:9px 16px 9px 12px;border-radius:10px;background:#0E7F44;color:#fff;font-weight:500;font-size:21px;letter-spacing:-.02em;white-space:nowrap;opacity:0}
.pinn svg{width:24px;height:24px}
.cur{position:absolute;left:0;top:0;display:flex;align-items:flex-start;pointer-events:none;opacity:0;z-index:7}
.cur svg{width:24px;height:30px;fill:#fff;stroke:#000;stroke-width:1.2}
.cur span{margin:20px 0 0 -4px;padding:6px 12px;border-radius:10px;background:#fff;color:#000;font-size:17px;white-space:nowrap}

/* 7 */
#goal{position:absolute;left:60px;right:60px;border-top:3px dashed currentColor;opacity:0}
#goalT{position:absolute;right:0;top:-34px;font-size:18px}

/* poster */
.po{position:absolute;left:60px;right:60px;top:84px}
.ro{width:100%;border-left:0;border-right:0;border-bottom:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;transition:color .2s}
.ro b{transition:transform .35s cubic-bezier(.2,1.25,.36,1),color .2s}
.ro:hover b{transform:translateX(12px);color:var(--ac2,#7C9BFF)}
.ro{display:grid;grid-template-columns:600px minmax(0,1fr);align-items:baseline;gap:24px;border-top:1px solid rgba(255,255,255,.18);padding:6px 0 4px;opacity:0}
.ro b{font-weight:500;font-size:62px;line-height:1.08;letter-spacing:-.055em}
.ro b sup{font:400 13px var(--mono);letter-spacing:0;vertical-align:top;margin-right:12px;opacity:.5;position:relative;top:15px}
.ro span{font-size:18px;line-height:1.24;letter-spacing:-.018em;opacity:.72}
.po-end{position:absolute;left:60px;right:60px;bottom:38px;display:flex;justify-content:space-between;align-items:center;font-size:18px;opacity:0}
.cta{display:inline-flex;align-items:center;height:52px;padding:0 24px;border-radius:17px;background:var(--accent);color:#fff;font-weight:500;font-size:17px;text-decoration:none;transition:background .25s}
.fl4{transform-box:fill-box;transform-origin:50% 50%;animation:fl4 14s ease-in-out infinite}
@keyframes fl4{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-14px) rotate(9deg)}}
@media (prefers-reduced-motion:reduce){.frame,.stage{transition:none}.fl4{animation:none}}
</style>
</head>
<body>
<div class="wrap" style="padding-bottom:0"><div class="fr-label"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3.5 1v10M8.5 1v10M1 3.5h10M1 8.5h10"/></svg>Обо мне</div></div>
<section class="track" id="track" aria-label="Дизайн-процесс">
  <div class="pin" style="padding-left:clamp(8px,2vw,24px);padding-right:clamp(8px,2vw,24px)"><div class="frame" id="frame">
    <div class="stage" id="stage">
      <div class="ey" id="ey"></div>
      <div class="prog" id="prog"></div>

      <div class="sc" data-s="0"><p class="big" id="bigT">Как я&nbsp;делаю продукты. <em>Семь шагов от&nbsp;гипотезы до&nbsp;метрики.</em></p></div>

      <div class="sc" data-s="1"><div class="word" id="w1"></div><div class="formula" id="fml">Если <b>X</b>, метрика <b>Y</b> изменится, потому что <b>Z</b></div></div>

      <div class="sc" data-s="2"><svg class="lk" id="lk2" aria-hidden="true"></svg><div class="word" id="w2"></div><span class="chip" id="c2a">Успех</span><span class="chip bad" id="c2b">Нет сети</span></div>

      <div class="sc" data-s="3"><canvas id="cv" width="2720" height="1600" aria-hidden="true"></canvas><div class="word" id="w3" style="visibility:hidden"></div></div>

      <div class="sc" data-s="4"><svg id="bl4" style="position:absolute;left:0;top:0;width:1360px;height:800px;overflow:visible;pointer-events:none" viewBox="0 0 1360 800" aria-hidden="true"></svg><div class="word" id="w4"></div></div>

      <div class="sc" data-s="5"><div class="word" id="w5"></div><span id="rog">ф</span><span id="rogT">Нет в библиотеке</span></div>

      <div class="sc" data-s="6"><div class="word" id="w6"></div><i id="gate"></i><div class="pinn" id="pin6"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="M9 7 2 14l7 7M19 7l7 7-7 7M16 4l-4 20" fill="none" stroke="#fff" stroke-width="2.6"/></svg>Ready for dev</div><div class="cur" id="cur6"><svg viewBox="0 0 18 22"><path d="M1 1v17l5-4 3 7 3-1-3-7h7z"/></svg><span>Специалист</span></div></div>

      <div class="sc" data-s="7"><div id="goal"><span id="goalT">цель из гипотезы</span></div><div class="word" id="w7" style="top:230px"></div></div>

      <div class="sc" data-s="8"><div class="po" id="po"></div><div class="po-end" id="poE"><span>Выводы запускают следующий цикл.</span><a class="cta" href="#next">Обсудить проект</a></div></div>

      <p class="say" id="say" aria-live="polite"></p>
      <a class="skip" id="skip" href="#next">Пропустить</a>
    </div>
  </div></div>
</section>
<div class="after" id="next">Следующий блок сайта</div>

<script>

    { w: 'Атомы', e: '3 · Атомарная система', t: 'Определяю токены и компоненты. Собираю атомарную систему: меняем один токен, и правка доходит до всех экранов.', bg: '#F5F5F7', fg: '#1D1D1F', d: 'Токены, компоненты и их состояния. Дизайн и код одно и то же.' },
    { w: 'Визуал', e: '4 · Визуал и бренд', t: 'Работаю внутри привычных паттернов, а новизну добавляю в подаче и деталях. Задаю визуальный язык: один на сайте, в продукте и в рекламе.', bg: '#2F5CFF', fg: '#FFFFFF', d: 'Привычные паттерны, узнаваемый язык бренда, motion со смыслом.' },

  }

  /* ---------- scene furniture ---------- */
  function build() {
    [1, 2, 3, 4, 5, 6, 7].forEach(i => { $('#w' + i).innerHTML = ''; makeWord(i, i === 2 ? 240 : i === 7 ? 280 : i === 3 ? 440 : 340); });
    /* guides: Figma construction lines at the cap height and the baseline */
    $$('.gd').forEach(x => x.remove());
    [1, 5].forEach(i => { const sc = $(`.sc[data-s="${i}"]`); ['Базовая линия', 'Верх буквы'].forEach(t => { const d = document.createElement('i'); d.className = 'gd'; d.innerHTML = `<span>${t}</span>`; sc.insertBefore(d, sc.firstChild); }); });
    /* 7: exact ink height of the last letter, and a baseline mark */
    const mk = document.createElement('i'); mk.style.cssText = 'display:inline-block;width:0;height:0'; W[7].line.appendChild(mk); W[7].mark = mk;
    const mc = document.createElement('canvas').getContext('2d'); mc.font = `500 ${W[7].fs}px Geist, sans-serif`;
    W[7].ink = mc.measureText('а').actualBoundingBoxAscent;
    W[7].box.style.alignItems = 'flex-end';
    /* 1 */
    const c = document.createElement('i'); c.className = 'caret'; W[1].line.appendChild(c); W[1].caret = c;
    const fb = document.createElement('div'); fb.className = 'fbox'; fb.innerHTML = '<i></i><i></i><i></i><i></i><span>Текст · Geist 500</span>'; W[1].line.appendChild(fb); W[1].fb = fb;
    fb.style.cssText = 'left:-10px;right:-10px;top:6%;bottom:6%';
    /* 2: the tail of the word exists twice: one goes well, the other breaks */

    const fill = document.createElement('div'); fill.className = 'line fl'; fill.style.webkitTextStroke = '0'; fill.innerHTML = w4.ls.map(l => `<span class="l">${l.textContent}</span>`).join(''); w4.line.appendChild(fill); w4.fill = fill;

  function blobs() {

    const add = (cx, cy, o, f) => { const pop = mk('g', {}, v), fl = mk('g', { class: 'fl4', style: `animation-delay:${-o * 20}s` }, pop); f(fl, cx, cy); B4.push({ g: pop, cx, cy, o }); };
