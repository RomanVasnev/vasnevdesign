<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1160" viewBox="0 0 1920 1160"><rect width="1920" height="1160" fill="#0B0B0B"/><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="44" fill="#FFFFFF" font-weight="500"><tspan x="80" y="110">Бенчмаркинг</tspan></text><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="22" fill="#8A8A8A" font-weight="400"><tspan x="80" y="160">4 лаунчпада и 2 биржи: что взяли в Bitflare и где теряется инвестор</tspan></text><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="20" fill="#8A8A8A" font-weight="400"><tspan x="104" y="240">Платформа</tspan></text><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="20" fill="#8A8A8A" font-weight="400"><tspan x="444" y="240">Модель</tspan></text><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="20" fill="#8A8A8A" font-weight="400"><tspan x="844" y="240">Что взяли</tspan></text><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="20" fill="#8A8A8A" font-weight="400"><tspan x="1324" y="240">Где теряется инвестор</tspan></text><rect x="80" y="270" width="1760" height="112" rx="22" fill="#141414"/><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="26" fill="#FFFFFF" font-weight="500"><tspan x="104" y="334">PinkSale</tspan></text><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="20" fill="#C9C9C9" font-weight="400"><tspan x="444" y="316">Открытые пресейлы</tspan><tspan x="444" y="343">для любых проектов</tspan></text><circle cx="850" cy="310" r="6" fill="#C3FF38"/><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="20" fill="#FFFFFF" font-weight="400"><tspan x="868" y="316">Бейджи KYC и Audit</tspan><tspan x="868" y="343">как первый сигнал доверия</tspan></text><circle cx="1330" cy="310" r="6" fill="none" stroke="#FF6B5A" stroke-width="2.5"/><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="20" fill="#C9C9C9" font-weight="400"><tspan x="1348" y="316">Бейджи есть, а команду</tspan><tspan x="1348" y="343">и токеномику ищут по странице</tspan></text><rect x="80" y="394" width="1760" height="112" rx="22" fill="#141414"/><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="26" fill="#FFFFFF" font-weight="500"><tspan x="104" y="458">DxSale</tspan></text><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="20" fill="#C9C9C9" font-weight="400"><tspan x="444" y="440">Пресейл и блокировка</tspan><tspan x="444" y="467">ликвидности без кода</tspan></text><circle cx="850" cy="434" r="6" fill="#C3FF38"/><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="20" fill="#FFFFFF" font-weight="400"><tspan x="868" y="440">Параметры раунда</tspan><tspan x="868" y="467">одной строкой</tspan></text><circle cx="1330" cy="434" r="6" fill="none" stroke="#FF6B5A" stroke-width="2.5"/><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="20" fill="#C9C9C9" font-weight="400"><tspan x="1348" y="440">Нет уровней участия:</tspan><tspan x="1348" y="467">кто успел, тот и купил</tspan></text><rect x="80" y="518" width="1760" height="112" rx="22" fill="#141414"/><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="26" fill="#FFFFFF" font-weight="500"><tspan x="104" y="582">Polkastarter</tspan></text><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="20" fill="#C9C9C9" font-weight="400"><tspan x="444" y="564">Отбор проектов и тиры</tspan><tspan x="444" y="591">по POLS Power + лотерея</tspan></text><circle cx="850" cy="558" r="6" fill="#C3FF38"/><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="20" fill="#FFFFFF" font-weight="400"><tspan x="868" y="564">Уровни участия</tspan><tspan x="868" y="591">с понятной выгодой</tspan></text><circle cx="1330" cy="558" r="6" fill="none" stroke="#FF6B5A" stroke-width="2.5"/><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="20" fill="#C9C9C9" font-weight="400"><tspan x="1348" y="564">Тиры и шансы объяснены</tspan><tspan x="1348" y="591">процентами — выбор неочевиден</tspan></text><rect x="80" y="642" width="1760" height="112" rx="22" fill="#141414"/><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="26" fill="#FFFFFF" font-weight="500"><tspan x="104" y="706">TrustPad</tspan></text><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="20" fill="#C9C9C9" font-weight="400"><tspan x="444" y="688">Уровни по стейкингу TPAD,</tspan><tspan x="444" y="715">гарантированная аллокация</tspan></text><circle cx="850" cy="682" r="6" fill="#C3FF38"/><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="20" fill="#FFFFFF" font-weight="400"><tspan x="868" y="688">Гарантированная</tspan><tspan x="868" y="715">аллокация на уровне</tspan></text><circle cx="1330" cy="682" r="6" fill="none" stroke="#FF6B5A" stroke-width="2.5"/><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="20" fill="#C9C9C9" font-weight="400"><tspan x="1348" y="688">Длинная лестница уровней —</tspan><tspan x="1348" y="715">сложно понять, что выбрать</tspan></text><rect x="80" y="766" width="1760" height="112" rx="22" fill="#141414"/><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="26" fill="#FFFFFF" font-weight="500"><tspan x="104" y="830">Binance, Bybit</tspan></text><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="20" fill="#C9C9C9" font-weight="400"><tspan x="444" y="812">Биржи: кошелёк</tspan><tspan x="444" y="839">и безопасность</tspan></text><circle cx="850" cy="806" r="6" fill="#C3FF38"/><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="20" fill="#FFFFFF" font-weight="400"><tspan x="868" y="812">Депозит: монета → сеть → адрес,</tspan><tspan x="868" y="839">MEMO-предупреждение, единый 2FA</tspan></text><circle cx="1330" cy="806" r="6" fill="none" stroke="#FF6B5A" stroke-width="2.5"/><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="20" fill="#C9C9C9" font-weight="400"><tspan x="1348" y="812">Эталон для кошелька,</tspan><tspan x="1348" y="839">но не для размещений</tspan></text><rect x="80" y="904" width="1760" height="196" rx="28" fill="#C3FF38"/><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="30" fill="#0B0B0B" font-weight="500"><tspan x="104" y="974">Bitflare</tspan></text><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="20" fill="#3D4A12" font-weight="400"><tspan x="104" y="1012">решение</tspan></text><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="24" fill="#0B0B0B" font-weight="500"><tspan x="444" y="970">Доверие в первом экране</tspan></text><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="20" fill="#1E2608" font-weight="400"><tspan x="444" y="1010">Бейджи KYC Verified, Audited,</tspan><tspan x="444" y="1037">VC Backed рядом с названием</tspan></text><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="24" fill="#0B0B0B" font-weight="500"><tspan x="868" y="970">3 × 3 тира карточками</tspan></text><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="20" fill="#1E2608" font-weight="400"><tspan x="868" y="1010">Уровень по цвету, в карточке —</tspan><tspan x="868" y="1037">бонус, цена и итог в токенах</tspan></text><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="24" fill="#0B0B0B" font-weight="500"><tspan x="1348" y="970">Покупка без тупиков</tspan></text><text font-family="Geist, 'Noto Sans CJK SC', Inter, sans-serif" font-size="20" fill="#1E2608" font-weight="400"><tspan x="1348" y="1010">Любая ветка ведёт обратно</tspan><tspan x="1348" y="1037">в Review transaction</tspan></text></svg>